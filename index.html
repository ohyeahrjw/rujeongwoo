        const thSymKey = (ch, cls, k) => {
          const g = TH_GLYPH_Y[ch];
          if (!g) return mk(ch, cls, k);
          return (
            '<div class="ikb-key ' +
            (cls ? cls + " " : "") +
            'g" data-k="' +
            E(k !== undefined ? k : ch) +
            '" data-l="' +
            (cls ? "" : E(ch)) +
            '"><img alt="" draggable="false" src="data:image/png;base64,' +
            g[0] +
            '" style="left:' +
            g[1] +
            "%;--t:" +
            g[2] +
            ";width:" +
            g[3] +
            '%"></div>'
          );
        };

        function kbRender(lang, layer) {
          cur.lang = lang;
          cur.layer = layer;
          const kb = cur.kb;
          const symL = layer === "sym" || layer === "hash";
          kb.className =
            "ikb " +
            lang +
            (lang === "th" && !symL ? " thk" : "") +
            (symL ? " sy" : "");
          const isTh = lang === "th";
          const styled = lang !== "ja"; // th / en / ko ใช้ชุดปุ่มและไอคอนแบบเดียวกัน
          let h = "";
          if (lang === "ja") {
            KANA.forEach((r) => {
              h +=
                '<div class="ikb-row">' +
                r
                  .map((c) => (c ? mk(c) : '<div class="ikb-key sp"></div>'))
                  .join("") +
                "</div>";
            });
            h +=
              '<div class="ikb-row">' +
              JA_FN.slice(0, 4)
                .map((c) => mk(c, "fn"))
                .join("") +
              mk(LAYOUT.ja.name, "space", "space") +
              mk("⌫", "fn", "back") +
              mk("ส่ง", "send", "send") +
              "</div>";
          } else {
            const rows = rowsOf(lang, layer);
            rows.forEach((r, i) => {
              const chars = Array.from(r);
              const last = i === rows.length - 1;
              const pad =
                !last &&
                chars.length < Array.from(rows[0]).length - (isTh ? 1 : 0);
              h +=
                '<div class="ikb-row' +
                (pad ? " pad" : "") +
                (last && symL ? " sy3" : "") +
                '">' +
                (last
                  ? symL
                    ? thSymKey(
                        layer === "sym" ? "#+=" : "123",
                        "fn",
                        layer === "sym" ? "hash" : "sym",
                      )
                    : styled
                      ? thFn(
                          TH_IC.shift,
                          layer === "shift" ? "on" : "",
                          "shift",
                        )
                      : mk(
                          "⇧",
                          "fn" + (layer === "shift" ? " on" : ""),
                          "shift",
                        )
                  : "") +
                chars
                  .map((c) =>
                    symL && TH_GLYPH_Y[c]
                      ? thSymKey(c)
                      : isTh &&
                          (layer === "base" || layer === "shift") &&
                          (layer === "shift" ? TH_GLYPH_S : TH_GLYPH)[c]
                        ? thGlyph(c, layer)
                        : mk(c),
                  )
                  .join("") +
                (last
                  ? styled
                    ? thFn(TH_IC.back, "", "back")
                    : mk("⌫", "fn", "back")
                  : "") +
                "</div>";
            });
            h +=
              '<div class="ikb-row bottom">' +
              (symL
                ? isTh
                  ? thSymKey("กขค", "fn", "abc")
                  : mk(LAYOUT[lang].abc, "fn", "abc")
                : mk("123", "fn", "sym")) +
              (styled
                ? thFn(TH_IC.emoji, "", "globe")
                : mk("🌐", "fn", "globe")) +
              mk(isTh || styled ? "" : LAYOUT[lang].name, "space", "space") +
              (styled
                ? '<div class="ikb-key send ret" data-k="send" data-l="">' +
                  TH_IC.ret +
                  "</div>"
                : mk("ส่ง", "send", "send")) +
              "</div>";
          }
          if (styled) h += thFoot();
          kb.innerHTML = h;
        }

        async function tapKey(id) {
          if (!cur) return;
          const el = Array.from(cur.kb.querySelectorAll(".ikb-key")).find(
            (e) => e.dataset.k === id,
          );
          if (!el) return;
          el.classList.add("down");
          if (alive() && id !== "send")
            sfx(id === "back" ? "keyDel" : id.length > 1 ? "keyMod" : "key");
          await sleep(rand(80, 115));
          el.classList.remove("down");
        }

        async function ensureLayer(layer) {
          if (!layer || cur.lang === "ja" || cur.layer === layer) return;
          const inSym = cur.layer === "sym" || cur.layer === "hash";
          if (layer === "hash") {
            if (!inSym) {
              await tapKey("sym");
              kbRender(cur.lang, "sym");
              await sleep(70);
            }
            await tapKey("hash");
            kbRender(cur.lang, "hash");
          } else if (layer === "sym") {
            await tapKey("sym");
            kbRender(cur.lang, "sym");
          } else if (layer === "shift") {
            if (inSym) {
              await tapKey("abc");
              kbRender(cur.lang, "base");
              await sleep(70);
            }
            await tapKey("shift");
            kbRender(cur.lang, "shift");
          } else if (layer === "base") {
            await tapKey("abc");
            kbRender(cur.lang, "base");
          }
          await sleep(70);
        }

        function setValue(v) {
          cur.field.value = v;
          cur.field.scrollLeft = cur.field.scrollWidth;
          cur.scr.classList.toggle("has-text", v.length > 0);
        }

        async function typeText(text, lang) {
          if (cur.lang !== lang) {
            await tapKey("globe");
            await sleep(120);
            kbRender(lang, "base");
            await sleep(260);
          }
          for (const st of plan(text, lang)) {
            if (!cur || !alive()) return; // ออกจากห้องแล้ว → เลิกกดแป้น (ข้อความยังถูกส่งต่อเบื้องหลัง)
            if (st.direct) {
              sfx("key");
              setValue(st.disp);
              await sleep(120);
              continue;
            }
            if (st.fn) {
              if (
                cur.layer !== "base" &&
                cur.lang !== "ja" &&
                st.key === "space"
              ) {
                /* space works in any layer */
              }
              await tapKey(st.key);
            } else {
              await ensureLayer(st.layer);
              await tapKey(st.key);
              if (st.layer === "shift") kbRender(cur.lang, "base"); // auto-unshift
            }
            setValue(st.disp);
            await sleep(rand(60, 120));
          }
        }

        /* ---------- bubbles ---------- */
        /* alive = กำลังเปิดหน้าแชทอยู่จริง (ไม่ใช่แค่ DOM ค้างอยู่ตอนปิดหน้าแล้ว) */
        const alive = () =>
          !!cur &&
          document.body.contains(cur.area) &&
          !!$(
            cur.ig
              ? "#instagram-screen.active"
              : cur.kk
                ? "#app-screen.active"
                : "#chat-detail-screen.active",
          );
        const viewing = (key) => alive() && cur.key === key;
        const sfx = (n, ...a) => {
          try {
            if (window.SFX && SFX[n]) SFX[n](...a);
          } catch (e) {}
        };

        /* ริคุตอบตอนเราไม่ได้อยู่ในห้องแชท → เพิ่ม badge + เสียงแจ้งเตือน */
        function notifyAway(key, text) {
          if (key === "ig_riku") {
            try {
              window.__igNotifyAway(text);
            } catch (e) {}
            return;
          }
          appBadges.messages = (appBadges.messages || 0) + 1;
          try {
            renderHomeAndDock();
          } catch (e) {}
          document
            .querySelectorAll("#app-grid .badge, #dock .badge")
            .forEach((b) => b.classList.add("badge-pop"));
          if ($("#app-screen.active .m-row")) {
            // อยู่หน้ารายการข้อความ → รีเฟรชให้เห็นพรีวิว + จุดฟ้า
            try {
              window.openApp("messages", "Messages");
            } catch (e) {}
          }
          if (window.showMsgBanner && !$("#app-screen.active .m-row"))
            showMsgBanner(key); // อยู่หน้าอื่น → แบนเนอร์เด้งจากด้านบน
          sfx("notify");
        }
        /* Kakao: เลื่อนลงสุดแบบทันที (ไม่ smooth) แล้วตรึงไว้ต่อเนื่องสั้นๆ — แบบ smooth ทำให้บับเบิลใหม่โผล่ใต้แป้นก่อนค่อยไต่ขึ้นมา
     และตอนแป้นเลื่อนขึ้น padding ค่อยๆ ขยายใน .34s ทำให้ปลายทางที่คำนวณไว้เร็วเกินไปจนบับเบิลล่างสุดโดนแป้นบัง */
        const pinEnd = (ms) => {
          const a = cur && cur.area;
          if (!a) return;
          const t0 = performance.now();
          const step = () => {
            if (!alive() || cur.area !== a) return;
            a.scrollTop = a.scrollHeight;
            if (performance.now() - t0 < ms) requestAnimationFrame(step);
          };
          step();
        };
        const scrollEnd = () => {
          if (!alive()) return;
          if (cur.kk) {
            pinEnd(cur.scr.classList.contains("kb-on") ? 420 : 120);
            return;
          }
          cur.area.scrollTo({ top: cur.area.scrollHeight, behavior: "smooth" });
        };

        function addBubble(dir, text, html) {
          if (!alive()) return;
          if (cur.ig) {
            igRefresh(true);
            scrollEnd();
            return;
          }
          const area = cur.area;
          area
            .querySelectorAll(".cd-deliv, .cd-line.typing")
            .forEach((e) => e.remove());
          const lines = area.querySelectorAll(".cd-line");
          const prev = lines[lines.length - 1];
          const same = prev && prev.classList.contains(dir);
          if (same) prev.querySelector(".b").classList.remove("last");
          const line = document.createElement("div");
          line.className = "cd-line " + dir + (same ? "" : " first") + " pop";
          line.innerHTML =
            '<div class="b ' + dir + ' last">' + (html || E(text)) + "</div>";
          area.appendChild(line);
          scrollEnd();
        }
        function addTyping() {
          if (!alive()) return;
          if (cur.kk) {
            cur.area
              .querySelectorAll(".kk-l.typing")
              .forEach((e) => e.remove());
            cur.area.insertAdjacentHTML(
              "beforeend",
              '<div class="kk-l first typing"><div class="kk-av2"><img src="' +
                KK_AV_SRC +
                '" alt=""></div><div class="kk-col"><div class="kk-sender">' +
                E(KK_NAME) +
                '</div><div class="kk-wrap"><div class="kk-b l kk-tp"><i></i><i></i><i></i></div></div></div></div>',
            );
            scrollEnd();
            return;
          }
          if (cur.ig) {
            cur.area
              .querySelectorAll(".dm-m.typing")
              .forEach((e) => e.remove());
            const c = window.__igChat && window.__igChat();
            const av =
              c && c.avatar ? '<img src="' + E(c.avatar) + '" alt="">' : "";
            cur.area.insertAdjacentHTML(
              "beforeend",
              '<div class="dm-m in gs typing"><span class="dm-mav">' +
                av +
                '</span><div class="dm-b in tp"><i></i><i></i><i></i></div></div>',
            );
            scrollEnd();
            return;
          }
          cur.area
            .querySelectorAll(".cd-line.typing")
            .forEach((e) => e.remove());
          const line = document.createElement("div");
          line.className = "cd-line first typing pop";
          line.innerHTML =
            '<div class="b in last tp"><i></i><i></i><i></i></div>';
          cur.area.appendChild(line);
          scrollEnd();
        }
        function deliver() {
          if (!alive()) return;
          if (cur.ig)
            return; /* ห้อง DM ไอจีมีข้อความ "เห็นแล้ว" ต่อท้ายให้อยู่แล้ว */
          const d = document.createElement("div");
          d.className = "cd-deliv";
          d.textContent = "ส่งแล้ว";
          cur.area.appendChild(d);
          scrollEnd();
        }

        function pushData(key, type, text) {
          if (key === "ig_riku") {
            const ic = window.__igChat && window.__igChat();
            if (!ic) return;
            ic.messages.push({ type, text });
            ic.time = "now";
            ic.activityAt = Date.now();
            return;
          }
          const c = chatDataMessages[key];
          c.messages.push({ type, text });
          c.preview = text;
          const n = new Date();
          c.time =
            String(n.getHours()).padStart(2, "0") +
            ":" +
            String(n.getMinutes()).padStart(2, "0");
        }

        /* ---------- choices ---------- */
        function hideTray() {
          if (cur && cur.tray) {
            cur.tray.classList.remove("show");
          }
        }

        function showChoices() {
          if (!alive()) return;
          const st = state[cur.key];
          const node = CHAT_SCRIPTS[cur.key].nodes[st.node];
          const tray = cur.tray;
          if (!st.busy && (!node || !node.choices || !node.choices.length)) {
            hideTray();
            setTimeout(kbClose, 400);
            return;
          }
          if (st.busy || !cur.scr.classList.contains("kb-on")) {
            hideTray();
            return;
          }
          tray.innerHTML = node.choices
            .map(
              (c, i) =>
                '<button class="kb-choice" data-i="' +
                i +
                '" style="--n:' +
                i +
                '"><span>' +
                E(c.text) +
                "</span></button>",
            )
            .join("");
          tray.querySelectorAll(".kb-choice").forEach(
            (b) =>
              (b.onclick = (e) => {
                e.stopPropagation();
                choose(+b.dataset.i);
              }),
          );
          cur.scr.style.setProperty("--trayh", tray.offsetHeight + "px");
          cur.area.scrollTop = cur.area.scrollHeight; // ดันแชทขึ้นมาเหนือช้อยส์ก่อน
          requestAnimationFrame(() => {
            if (!alive()) return;
            cur.area.scrollTop = cur.area.scrollHeight;
            tray.classList.add("show"); // แล้วค่อยให้ช้อยส์ค่อย ๆ ขึ้น
          });
        }

        async function choose(i) {
          const key = cur.key,
            st = state[key];
          if (st.busy) return;
          const choice = CHAT_SCRIPTS[key].nodes[st.node].choices[i];
          if (!choice) return;
          /* พิมพ์ข้อความตามที่ช้อยส์แสดงอยู่จริง (แปลแล้ว) ด้วยแป้นของภาษานั้น */
          const shownEl = cur.tray.querySelector(
            '.kb-choice[data-i="' + i + '"] span',
          );
          const shown = (shownEl && shownEl.textContent.trim()) || choice.text;
          let kl = choice.lang || uiLang();
          if (!choice.lang && kl !== "th" && /[฀-๿]/.test(shown)) kl = "th"; // ยังไม่มีคำแปล → ยังเป็นไทย ใช้แป้นไทย
          st.busy = true;
          st.running = true;
          try {
            hideTray();
            cur.scr.style.setProperty("--trayh", "0px");
            await typeText(shown, kl);
            if (viewing(key)) {
              await sleep(240);
              await tapKey("send");
              setValue("");
              sfx("send");
            }
            pushData(key, "outgoing", choice.text);
            if (
              key === "ig_riku" &&
              /^mc[123]$/.test(st.node) &&
              window.__rkPromise
            )
              window.__rkPromise(
                +st.node.slice(2),
              ); /* ตอบว่าจะโทรไปง้อ → ปลดล็อกบทโทรออกง้อริคุ */
            addBubble("out", choice.text);
            deliver();
            const rep =
              choice.replies[Math.floor(Math.random() * choice.replies.length)];
            await sleep(rand(700, 1100));
            for (const m of rep.msgs) {
              st.typing = true;
              addTyping();
              await sleep(rand(800, 1200) + m.length * 20);
              st.typing = false;
              pushData(key, "incoming", m);
              if (viewing(key)) {
                addBubble("in", m);
                sfx("receive");
              } // อยู่ในห้อง → เสียงรับข้อความ
              else notifyAway(key, m); // ออกไปแล้ว → badge + เสียงแจ้งเตือน
              await sleep(260);
            }
            st.node =
              rep.next !== undefined
                ? rep.next
                : choice.next !== undefined
                  ? choice.next
                  : null;
            await sleep(900 + Math.min(2600, rep.msgs.join("").length * 45)); // เวลาอ่านคำตอบ
          } finally {
            st.typing = false;
            st.busy = false;
            st.running = false;
          }
          if (viewing(key)) showChoices();
        }

        function kbOpen() {
          if (!alive()) return;
          if (cur.kk) {
            /* Kakao: เปิดแป้นเฉพาะตอนยังมีข้อความรอพิมพ์ และริคุไม่ได้กำลังตอบอยู่ */
            if (kkSt.busy || !KK_SCRIPT[kkSt.i]) return;
            syncLang();
            cur.scr.classList.add("kb-on");
            pinEnd(420); // padding ขยายระหว่างแป้นเลื่อนขึ้น → ตรึงที่ล่างสุดตลอด ไม่ให้บับเบิลสุดท้ายจมใต้แป้น
            return;
          }
          if (cur.ig) {
            /* DM ไอจี: ยังไม่มีช้อยส์ให้ตอบ (ยังไม่ได้รีแอคสตอรี่ / บทสนทนาจบแล้ว) → ไม่เปิดแป้น */
            const st0 = state[cur.key],
              n0 = CHAT_SCRIPTS[cur.key].nodes[st0.node];
            if (!st0.busy && (!n0 || !n0.choices || !n0.choices.length)) return;
          }
          syncLang();
          cur.scr.classList.add("kb-on");
          setTimeout(showChoices, 220);
        }
        function kbClose() {
          if (
            !cur ||
            !cur.scr.classList.contains("kb-on") ||
            state[cur.key].busy
          )
            return;
          cur.scr.classList.remove("kb-on");
          cur.scr.style.setProperty("--trayh", "0px");
          hideTray();
        }

        function attach(key) {
          const scr = $("#chat-detail-screen");
          const area = $("#cd-area");
          const field = $(".cd-field input", scr);
          if (!scr || !area || !field) return;
          state[key] = state[key] || {
            node: CHAT_SCRIPTS[key].start,
            busy: false,
          };
          state[key].busy = !!state[key].running; // ถ้าริคุยังตอบอยู่เบื้องหลัง ให้รอจนจบก่อน
          scr.classList.remove("kb-on", "has-text");
          scr.style.setProperty("--trayh", "0px");
          field.readOnly = true;
          field.setAttribute("inputmode", "none");
          const mic = $(".cd-field svg", scr);
          if (mic) mic.classList.add("mic");
          const sendBtn = document.createElement("span");
          sendBtn.className = "kb-sendbtn";
          sendBtn.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
          $(".cd-field", scr).appendChild(sendBtn);
          const tray = document.createElement("div");
          tray.className = "kb-tray";
          const kb = document.createElement("div");
          kb.className = "ikb " + uiLang();
          scr.appendChild(tray);
          scr.appendChild(kb);
          cur = {
            key,
            scr,
            area,
            field,
            kb,
            tray,
            lang: uiLang(),
            layer: "base",
          };
          kbRender(cur.lang, "base");
          $(".cd-field", scr).addEventListener("click", kbOpen);
          area.addEventListener("click", kbClose);
          const sc = $("#chat-detail-screen .cd-area");
          if (sc) sc.scrollTop = sc.scrollHeight;
          if (state[key].typing) addTyping(); // กลับมาตอนริคุกำลังพิมพ์อยู่ → โชว์จุด ... ต่อ
        }

        /* ---------- DM ไอจีของริคุ: ใช้ engine เดียวกับแอปข้อความ ---------- */
        function igRefresh(pop) {
          const c = window.__igChat && window.__igChat();
          if (!c || !cur || !cur.area) return;
          const area = cur.area;
          Array.from(area.children).forEach((n) => {
            if (!n.classList.contains("dm-intro")) n.remove();
          });
          area.insertAdjacentHTML("beforeend", window.__igBodyHtml(c));
          if (pop) {
            const ms = area.querySelectorAll(".dm-m");
            const l = ms[ms.length - 1];
            if (l) l.classList.add("pop");
          }
        }
        function attachIg() {
          const key = "ig_riku";
          const scr = $("#instagram-screen .ios-app.ig-dm-app"),
            area = $("#ig-dm-messages");
          const pill = scr && $(".dm-pill", scr),
            ph = pill && $(".dm-ph", pill);
          if (!scr || !area || !pill || !ph) {
            cur = null;
            return;
          }
          state[key] = state[key] || {
            node: CHAT_SCRIPTS[key].start,
            busy: false,
          };
          state[key].busy = !!state[key].running;
          const field = document.createElement("input");
          field.className = "dm-fi";
          field.readOnly = true;
          field.setAttribute("inputmode", "none");
          field.setAttribute("autocomplete", "off");
          field.placeholder = ph.textContent.trim();
          ph.replaceWith(field);
          const sendTxt = document.createElement("span");
          sendTxt.className = "dm-sendtxt";
          sendTxt.textContent = "ส่ง";
          pill.insertBefore(sendTxt, $(".dm-tools", pill));
          const tray = document.createElement("div");
          tray.className = "kb-tray";
          const kb = document.createElement("div");
          kb.className = "ikb " + uiLang();
          scr.classList.add("kb-ig");
          scr.style.setProperty("--trayh", "0px");
          scr.appendChild(tray);
          scr.appendChild(kb);
          cur = {
            key,
            scr,
            area,
            field,
            kb,
            tray,
            ig: true,
            lang: uiLang(),
            layer: "base",
          };
          kbRender(cur.lang, "base");
          pill.addEventListener("click", kbOpen);
          area.addEventListener("click", kbClose);
          if (state[key].typing) addTyping();
        }

        /* =====================================================================
     KakaoTalk — ห้อง "เจ้าหญิง": โต้ตอบทางเดียว ไม่มีช้อยส์
     แตะช่องข้อความ → แป้นพิมพ์ขึ้น → แตะที่แป้น → พิมพ์ข้อความที่กำหนดไว้ให้เองทีละตัว → ส่ง → ริคุตอบ
     แก้เนื้อเรื่องที่ KK_SCRIPT ด้านล่าง: me = ข้อความที่ชิอนพิมพ์ (ใส่เป็น array = ส่งต่อเนื่องหลายข้อความ), replies = ที่ริคุตอบ
     ===================================================================== */
        const KK_AV_SRC = "riku-10.jpg",
          KK_NAME = "เจ้าหญิง",

        /* read: true = ริคุอยู่หน้าจออ่านทันที → ไม่ขึ้นเลข 1 ; ไม่ใส่ = ยังไม่อ่าน ขึ้น "1" จนกว่าริคุจะเริ่มตอบ */
        const KK_SCRIPT = [
          {

          {

          {

              "พี่เองก็ต้องพิสูจน์เอาเองเหมือนกัน",

              "เจ้าหญิงน่ะ กำลังยิ้มอยู่~",

          },

        const kkSt = { i: 0, busy: false, typing: false };
        state[KK_KEY] = kkSt;

        function kkNextTime() {
          let last = "21:00";
          for (let i = kakaoMessages.length - 1; i >= 0; i--) {
            if (kakaoMessages[i].time) {
              last = kakaoMessages[i].time;
              break;
            }
          }
          const p = last.split(":");
          let m = +p[0] * 60 + +p[1] + 1;
          m %= 1440;
          return (
            String(Math.floor(m / 60)).padStart(2, "0") +
            ":" +
            String(m % 60).padStart(2, "0")
          );
        }

        function kkBubblesHtml() {
          const msgs = kakaoMessages;
          let h = "";
          msgs.forEach((m, i) => {
            if (m.type === "date") {
              h += '<div class="kk-date"><span>' + E(m.text) + "</span></div>";
              return;
            }
            const prev = msgs[i - 1],
              next = msgs[i + 1];
            const first =
              !prev || prev.type === "date" || prev.sender !== m.sender;
            const showTime =
              !next ||
              next.type === "date" ||
              next.sender !== m.sender ||
              next.time !== m.time;
            const text = E(m.text).replace(/\n/g, "<br>");
            const time = showTime
              ? '<span class="kk-t">' + E(m.time) + "</span>"
              : "";
            if (m.sender !== "sion") {
              h +=
                '<div class="kk-l' +
                (first ? " first" : "") +
                '">' +
                (first
                  ? '<div class="kk-av2"><img src="' +
                    KK_AV_SRC +
                    '" alt=""></div>'
                  : '<div class="kk-spacer"></div>') +
                '<div class="kk-col">' +
                (first
                  ? '<div class="kk-sender">' + E(KK_NAME) + "</div>"
                  : "") +
                '<div class="kk-wrap"><div class="kk-b l">' +
                text +
                "</div>" +
                time +
                "</div></div></div>";
            } else {
              const meta =
                (m.unread ? '<span class="kk-n">1</span>' : "") + time;
              h +=
                '<div class="kk-r' +
                (first ? " first" : "") +
                '">' +
                (meta ? '<div class="kk-meta">' + meta + "</div>" : "") +
                '<div class="kk-b r">' +
                text +
                "</div></div>";
            }
          });
          return h;
        }
        function kkRefresh(pop) {
          if (!alive() || !cur.kk) return;
          cur.area.innerHTML = kkBubblesHtml();
          if (pop) {
            const ls = cur.area.querySelectorAll(".kk-l, .kk-r");
            const l = ls[ls.length - 1];
            if (l) l.classList.add("kk-pop");
          }
          scrollEnd();
        }

        /* ข้อความที่แสดงอยู่จริงหลังแปล (ระบบ i18n แปลจาก DOM) — ใช้พิมพ์ด้วยแป้นของภาษานั้น */
        async function kkShown(text) {
          if (uiLang() === "th" || !cur || !cur.scr) return text;
          const probe = document.createElement("span");
          probe.style.cssText =
            "position:absolute;left:-9999px;top:0;opacity:0;pointer-events:none";
          probe.textContent = text;
          cur.scr.appendChild(probe);
          await sleep(70);
          const shown = probe.textContent.trim() || text;
          probe.remove();
          return shown;
        }

        function kkAway(text) {
          /* ริคุตอบตอนเราออกจากห้องไปแล้ว → badge + เสียงแจ้งเตือน */
          appBadges.kakaotalk = (appBadges.kakaotalk || 0) + 1;
          try {
            renderHomeAndDock();
          } catch (e) {}
          sfx("notify");
          try {
            window.showKkBanner(KK_NAME, text);
          } catch (e) {}
        }

        async function kkRun() {
          if (kkSt.busy || !cur || !cur.kk) return;
          const beat = KK_SCRIPT[kkSt.i];
          if (!beat) return;
          kkSt.busy = true;
          try {
            const parts = Array.isArray(beat.me) ? beat.me : [beat.me];
            for (const text of parts) {
              const shown = await kkShown(text);
              let kl = uiLang();
              if (kl !== "th" && /[฀-๿]/.test(shown)) kl = "th"; // ยังไม่มีคำแปล → ใช้แป้นไทย
              await typeText(shown, kl);
              if (viewing(KK_KEY)) {
                await sleep(240);
                await tapKey("send");
                setValue("");
                sfx("send");
              }
              kakaoMessages.push({
                sender: "sion",
                text,
                time: kkNextTime(),
                unread: !beat.read,
              });
              if (viewing(KK_KEY)) kkRefresh(true);
              await sleep(rand(450, 750));
            }
            await sleep(rand(500, 800));
            if (!beat.read && (beat.replies || []).length) {
              // ริคุเปิดอ่าน → เลข 1 หาย
              await sleep(rand(900, 1800));
              kakaoMessages.forEach((m) => {
                if (m.unread) m.unread = false;
              });
              if (viewing(KK_KEY)) kkRefresh(false);
              await sleep(rand(400, 800));
            }
            for (const r of beat.replies || []) {
              kkSt.typing = true;
              addTyping();
              await sleep(rand(800, 1200) + r.length * 20);
              kkSt.typing = false;
              kakaoMessages.push({ sender: "me", text: r, time: kkNextTime() });
              if (viewing(KK_KEY)) {
                kkRefresh(true);
                sfx("receive");
              } else kkAway(r);
              await sleep(260);
            }
            kkSt.i++;
            await sleep(500);
          } finally {
            kkSt.typing = false;
            kkSt.busy = false;
          }
          if (viewing(KK_KEY) && !KK_SCRIPT[kkSt.i]) setTimeout(kbClose, 400); // จบบทแล้ว → เก็บแป้น
        }

        function attachKk() {
          const scr = $(".ios-app.kk-room"),
            area = $("#kk-area");
          const field = scr && $(".kk-field input", scr);
          if (!scr || !area || !field) {
            cur = null;
            return;
          }
          field.readOnly = true;
          field.setAttribute("inputmode", "none");
          field.setAttribute("autocomplete", "off");
          scr.classList.remove("kb-on", "has-text");
          scr.style.setProperty("--trayh", "0px");
          const kb = document.createElement("div");
          kb.className = "ikb " + uiLang();
          scr.appendChild(kb);
          cur = {
            key: KK_KEY,
            kk: true,
            scr,
            area,
            field,
            kb,
            tray: document.createElement("div"),
            lang: uiLang(),
            layer: "base",
          };
          kbRender(cur.lang, "base");
          kb.addEventListener("click", () => {
            kkRun();
          }); // แตะตรงไหนบนแป้น = เริ่มพิมพ์ข้อความที่กำหนด
          $(".kk-field", scr).addEventListener("click", kbOpen);
          area.addEventListener("click", kbClose);
          area.innerHTML = kkBubblesHtml();
          scrollEnd(); // วาดใหม่ให้เลข 1 ที่ค้างอยู่แสดงตอนกลับเข้าห้อง
          if (kkSt.typing) addTyping(); // กลับเข้าห้องตอนริคุกำลังพิมพ์อยู่
        }
        window.__kkAttach = attachKk;

        /* ให้ฝั่งสตอรี่ตั้งโหนดบทสนทนา / ส่งข้อความริคุเข้าห้องที่เปิดอยู่ */
        window.__igSetNode = function (node) {
          const key = "ig_riku";
          state[key] = state[key] || { node: null, busy: false };
          state[key].node = node;
          if (
            viewing(key) &&
            cur.scr.classList.contains("kb-on") &&
            !state[key].busy
          )
            showChoices();
        };
        window.__igAppend = function () {
          if (!viewing("ig_riku")) return false;
          igRefresh(true);
          scrollEnd();
          sfx("receive");
          return true;
        };
        const _igOpen = window.openInstagramChat;
        window.openInstagramChat = function (id) {
          const r = _igOpen.apply(this, arguments);
          if (id === "riku_new") attachIg();
          else if (cur && cur.ig) cur = null;
          return r;
        };

        const _open = window.openChatDetail;
        window.openChatDetail = function (key) {
          _open.apply(this, arguments);
          if (CHAT_SCRIPTS[key]) attach(key);
          else cur = null;
        };
        const _close = window.closeChatDetail;
        window.closeChatDetail = function () {
          const s = $("#chat-detail-screen");
          if (s) s.classList.remove("kb-on");
          if (_close) _close.apply(this, arguments);
        };
      })();

            r.g.gain.cancelScheduledValues(t);
            r.g.gain.setTargetAtTime(0, t, 0.015);
            r.o.forEach((o) => {
              try {
                o.stop(t + 0.12);
              } catch (e) {}
            });
          } catch (e) {}
        }

        const SFX = {
          get enabled() {
            return enabled;
          },
          setEnabled(v) {
            enabled = !!v;
            if (!enabled) {
              stopTone();
              stopRing();
            }
            try {
              localStorage.setItem("sfx-off", enabled ? "0" : "1");
            } catch (e) {}
          },

          /* --- แป้นพิมพ์: คลิกสั้น ๆ แบบไม้ของ iOS (ตัวอักษร / ลบ / ปุ่มฟังก์ชัน) --- */
          key: () =>
            play((t) => {
              const k = 1 + (Math.random() - 0.5) * 0.05;
              noise(t, 0.022, {
                f0: 2700 * k,
                f1: 1700 * k,
                q: 3,
                gain: 0.17,
                attack: 0.002,
              });
              tone(1250 * k, t, 0.03, {
                gain: 0.075,
                to: 900 * k,
                attack: 0.002,
              });
            }),
          keyDel: () =>
            play((t) => {
              noise(t, 0.028, {
                f0: 1700,
                f1: 1000,
                q: 3,
                gain: 0.17,
                attack: 0.002,
              });
              tone(820, t, 0.034, { gain: 0.08, to: 600, attack: 0.002 });
            }),
          keyMod: () =>
            play((t) => {
              noise(t, 0.025, {
                f0: 2200,
                f1: 1300,
                q: 3,
                gain: 0.15,
                attack: 0.002,
              });
              tone(1050, t, 0.032, { gain: 0.07, to: 780, attack: 0.002 });
            }),
          digit: () =>
            play((t) => {
              // ปุ่มตัวเลขหน้ารหัสผ่าน (คลิกเดียวกับแป้นพิมพ์)
              noise(t, 0.022, {
                f0: 2700,
                f1: 1700,
                q: 3,
                gain: 0.17,
                attack: 0.002,
              });
              tone(1250, t, 0.03, { gain: 0.075, to: 900, attack: 0.002 });
            }),
          tap: () =>
            play((t) => {
              // iOS ไม่มีเสียงแตะทั่วไป → เหลือแค่ติ๊กเบามาก ๆ
              tone(2200, t, 0.014, { gain: 0.016, attack: 0.002 });
            }),

          /* --- เปลี่ยนหน้า (iOS แทบไม่มีเสียง → เบาลงมาก) --- */
          open: () => {
            cancelTap();
            play((t) => {
              noise(t, 0.2, {
                f0: 500,
                f1: 2200,
                q: 0.9,
                gain: 0.04,
                attack: 0.07,
              });
            });
          },
          close: () => {
            cancelTap();
            play((t) => {
              noise(t, 0.18, {
                f0: 2200,
                f1: 500,
                q: 0.9,
                gain: 0.035,
                attack: 0.05,
              });
            });
          },
          swipe: () => {
            cancelTap();
            play((t) => {
              noise(t, 0.26, {
                f0: 400,
                f1: 1800,
                q: 0.8,
                gain: 0.05,
                attack: 0.1,
              });
            });
          },
          unlock: () => {
            cancelTap();
            play((t) => {
              // ปลดล็อก: "ต็อก" นุ่ม ๆ เหมือนเสียงล็อกของ iPhone
              noise(t, 0.035, {
                f0: 1600,
                f1: 800,
                q: 2.5,
                gain: 0.16,
                attack: 0.002,
              });
              tone(720, t, 0.07, { gain: 0.11, to: 430, attack: 0.002 });
            });
          },
          wrong: () =>
            play((t) => {
              // รหัสผิด: iOS ใช้การสั่นเป็นหลัก เสียงเป็นแค่ thud เบา ๆ
              tone(130, t, 0.14, { gain: 0.12, to: 85, attack: 0.004 });
              tone(130, t + 0.11, 0.14, { gain: 0.1, to: 85, attack: 0.004 });
            }),

          /* --- ข้อความ --- */
          send: () =>
            play((t) => {
              // "Sent" swoosh
              noise(t, 0.3, {
                f0: 700,
                f1: 4200,
                q: 1.0,
                gain: 0.13,
                attack: 0.1,
              });
              tone(900, t, 0.22, { to: 1900, gain: 0.03, attack: 0.06 });
            }),
          receive: () =>
            play((t) => {
              // เสียงรับข้อความขณะอยู่ในห้องแชท (pop แก้ว 2 โน้ต)
              glass(1568, t, 0.32, 0.13);
              glass(2093, t + 0.09, 0.5, 0.12);
            }),
          notify: () => {
            // เสียงแจ้งเตือนข้อความแบบ Tri-tone (แก้ว 3 โน้ต)
            const now = Date.now();
            if (now - lastNotify < 250) return;
            lastNotify = now;
            play((t) => {
              glass(1319, t, 0.55, 0.17, true);
              glass(1568, t + 0.14, 0.55, 0.17, true);
              glass(1976, t + 0.28, 1.0, 0.19, true);
            });
          },

          /* --- โทรศัพท์ --- */
          ringback: () => {
            // เสียงรอสายขณะโทรออก (เริ่มหลังกดโทรเล็กน้อย)
            if (!enabled) return;
            try {
              ensure();
              stopRing();
              const t0 = ctx.currentTime + 0.45;
              const g = ctx.createGain();
              g.gain.value = 0;
              g.connect(master);
              const o = [440, 480].map((f) => {
                const os = ctx.createOscillator();
                os.type = "sine";
                os.frequency.value = f;
                os.connect(g);
                os.start(t0);
                return os;
              });
              for (let c = 0; c < 12; c++) {
                const s0 = t0 + c * 6;
                g.gain.setValueAtTime(0, s0);
                g.gain.linearRampToValueAtTime(0.065, s0 + 0.03);
                g.gain.setValueAtTime(0.065, s0 + 2);
                g.gain.linearRampToValueAtTime(0, s0 + 2.03);
              }
              o.forEach((os) => os.stop(t0 + 72));
              ring = { g, o };
            } catch (e) {}
          },
          ringStop: () => {
            stopTone();
            if (ctx) stopRing();
          },
          ringtone: () => {
            // เสียงเรียกเข้า: ระฆังไล่โน้ตขึ้น-ลง วนทุก ~3.4 วิ จนกว่าจะรับ/ปฏิเสธ/ไม่ได้รับ
            if (!enabled) return;
            try {
              ensure();
            } catch (e) {
              return;
            }
            stopTone();
            const burst = () =>
              play((t) => {
                [659.3, 784, 987.8, 1318.5, 987.8, 784].forEach((f, i) =>
                  bell(f, t + i * 0.13, 0.5, 0.15, true),
                );
                [659.3, 784, 987.8, 1318.5, 1568].forEach((f, i) =>
                  bell(f, t + 1.0 + i * 0.13, 0.55, 0.15, true),
                );
              });
            burst();
            toneT = setInterval(burst, 3400);
          },
          connect: () =>
            play((t) => {
              // อีกฝ่ายรับสาย: คลิกสั้น ๆ
              tone(1100, t, 0.05, { gain: 0.07, attack: 0.002 });
              noise(t, 0.03, {
                f0: 2500,
                f1: 1500,
                q: 2,
                gain: 0.08,
                attack: 0.002,
              });
            }),
          busy: () =>
            play((t) => {
              // สายไม่ว่าง: 480+620Hz ติด 0.5 / ดับ 0.5
              for (let i = 0; i < 4; i++)
                hold([480, 620], t + 0.05 + i * 1.0, 0.5, 0.06);
            }),
          failed: () =>
            play((t) => {
              // ไม่มีผู้รับสาย / โทรไม่ติด: 3 โทนไล่ขึ้นแบบสัญญาณระบบ
              hold([913], t + 0.05, 0.27, 0.07);
              hold([1371], t + 0.34, 0.27, 0.07);
              hold([1777], t + 0.63, 0.4, 0.07);
            }),
          hangup: () =>
            play((t) => {
              // วางสาย: บี๊บสั้น 3 ครั้ง
              for (let i = 0; i < 3; i++) hold([480], t + i * 0.2, 0.1, 0.075);
            }),
          dtmf: (k) =>
            play((t) => {
              // กดแป้นเลขระหว่างสาย
              const f = DTMF[k];
              if (f) hold(f, t, 0.14, 0.06);
            }),
          toggle: () =>
            play((t) => {
              // ปิดเสียง / ลำโพง
              tone(1500, t, 0.03, { gain: 0.07, attack: 0.002 });
              noise(t, 0.02, {
                f0: 3000,
                f1: 2000,
                q: 2,
                gain: 0.07,
                attack: 0.002,
              });
            }),
        };
        window.SFX = SFX;

        /* ---------- ปลดล็อกเสียง (เบราว์เซอร์ต้องมีการแตะก่อน) ---------- */
        const unlock = () => {
          if (enabled) {
            try {
              ensure();
            } catch (e) {}
          }
        };
        ["pointerdown", "touchend", "click", "keydown"].forEach((ev) =>
          document.addEventListener(ev, unlock, {
            capture: true,
            passive: true,
          }),
        );

        /* ---------- เสียงแตะทั่วไป (ถูกยกเลิกอัตโนมัติถ้าหน้านั้นมีเสียงเปลี่ยนหน้าเอง) ---------- */
        document.addEventListener(
          "click",
          (e) => {
            const t = e.target;
            if (!t || !t.closest) return;
            if (t.closest(".key")) {
              SFX.digit();
              return;
            }
            if (t.closest(".ikb, .home-indicator-container, .call-screen"))
              return;
            if (
              t.closest(
                "button, [onclick], .app, .row, .kb-choice, .cd-field, .chat-item",
              )
            ) {
              clearTimeout(tapT);
              tapT = setTimeout(() => SFX.tap(), 0);
            }
          },
          true,
        );

        /* ---------- hook เปลี่ยนหน้าจอหลัก ---------- */
        const activeId = () => {
          const s = document.querySelector(".screen.active");
          return s ? s.id : "";
        };
        const _show = window.showScreen;
        if (typeof _show === "function") {
          window.showScreen = function (id) {
            const prev = activeId();
            const r = _show.apply(this, arguments);
            if (prev !== id) {
              if (prev === "lock-screen" && id === "passcode-screen")
                SFX.swipe();
              else if (prev === "passcode-screen" && id === "home-screen")
                SFX.unlock();
              else if (
                id === "home-screen" ||
                id === "lock-screen" ||
                id === "passcode-screen"
              )
                SFX.close();
              else SFX.open();
            }
            return r;
          };
        }

        const _vp = window.verifyPasscode;
        if (typeof _vp === "function") {
          window.verifyPasscode = function () {
            const r = _vp.apply(this, arguments);
            const pc = document.getElementById("passcode-screen");
            if (pc && pc.classList.contains("active")) SFX.wrong(); // รหัสผิด
            return r;
          };
        }

        /* ---------- hook เปิด/ปิดหน้าย่อยในแอป ---------- */
        const wrap = (name, fn) => {
          const o = window[name];
          if (typeof o !== "function") return;
          window[name] = function () {
            fn();
            return o.apply(this, arguments);
          };
        };
        [
          "openChatDetail",
          "openKakaoChat",
          "openNoteDetail",
          "openPhotoViewer",
        ].forEach((n) => wrap(n, () => SFX.open()));
        ["closeChatDetail", "closeNoteDetail", "closePhotoViewer"].forEach(
          (n) => wrap(n, () => SFX.close()),
        );
      })();

      /* =====================================================
   BANNER แจ้งเตือนข้อความใหม่ — เด้งจากด้านบนทุกหน้าจอ (รวมหน้าล็อก)
   แตะ = เข้าห้องแชท | ปัดขึ้น = ปิด | หายเองใน 4.5 วิ
   ===================================================== */
      (function () {
        "use strict";
        let el = null,
          timer = 0;
        const esc = (t) =>
          String(t).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );

        function build() {
          el = document.createElement("div");
          el.className = "msg-banner";
          (document.querySelector(".phone") || document.body).appendChild(el);
          let y0 = null;
          el.addEventListener("pointerdown", (e) => {
            y0 = e.clientY;
            try {
              el.setPointerCapture(e.pointerId);
            } catch (_) {}
          }); /* ลากพ้นกรอบแบนเนอร์ก็ยังนับ (เมาส์) */
          el.addEventListener("pointerup", (e) => {
            const dy = y0 === null ? 0 : e.clientY - y0;
            y0 = null;
            if (dy < -16) hide();
            else {
              const k = el.dataset.key;
              hide();
              open(k);
            }
          });
          el.addEventListener("pointercancel", () => {
            y0 = null;
          });
        }
        function hide() {
          clearTimeout(timer);
          if (el) el.classList.remove("show");
        }
        function open(key) {
          try {
            window.openApp("messages", "Messages");
            window.openChatDetail(key);
          } catch (e) {}
        }

        window.showMsgBanner = function (key) {
          const c =
            typeof chatDataMessages !== "undefined"
              ? chatDataMessages[key]
              : null;
          if (!c) return;
          if (!el) build();
          const was = el.classList.contains("show");
          el.dataset.key = key;
          const html =
            '<img class=\"av\" src=\"' +
            esc(c.avatar) +
            '\" alt=\"\" decoding=\"sync\">' +
            '<div class=\"tx\"><div class=\"t1\"><span>' +
            esc(c.name) +
            "</span><small>ตอนนี้</small></div>" +
            '<div class=\"t2\">' +
            esc(c.preview) +
            "</div></div>";
          /* เนื้อหาเดิมเป๊ะ → ไม่แตะ DOM (กันรูปโปรไฟล์วาบตอนแจ้งเตือนซ้ำ) */
          if (el.dataset.html !== html) {
            el.innerHTML = html;
            el.dataset.html = html;
          }
          el.classList.remove("bump");
          const go = () =>
            requestAnimationFrame(() =>
              requestAnimationFrame(() => {
                el.classList.add("show");
                if (was) el.classList.add("bump");
              }),
            );
          /* รอรูปถอดรหัสเสร็จก่อนค่อยเลื่อนลงมา ไม่ให้รูปโผล่ทีหลังแล้วกะพริบ */
          const img = el.querySelector("img.av");
          if (img && img.decode) img.decode().then(go, go);
          else go();
          clearTimeout(timer);
          timer = setTimeout(hide, 4500);
        };
        /* เข้าห้องแชทด้วยวิธีอื่นแล้ว → เก็บแบนเนอร์ */
        const _o = window.openChatDetail;
        if (typeof _o === "function")
          window.openChatDetail = function () {
            hide();
            return _o.apply(this, arguments);
          };

        /* ---- KakaoTalk: ริคุตอบตอนเราไม่ได้อยู่ในห้อง → แบนเนอร์ลอย (แตะ = เข้าห้อง "เจ้าหญิง") ---- */
        let kel = null,
          ktimer = 0;
        function kHide() {
          clearTimeout(ktimer);
          if (kel) kel.classList.remove("show");
        }
        function kBuild() {
          kel = document.createElement("div");
          kel.className = "msg-banner ig-banner kk-banner";
          (document.querySelector(".phone") || document.body).appendChild(kel);
          let y0 = null;
          kel.addEventListener("pointerdown", (e) => {
            y0 = e.clientY;
            try {
              kel.setPointerCapture(e.pointerId);
            } catch (_) {}
          });
          kel.addEventListener("pointerup", (e) => {
            const dy = y0 === null ? 0 : e.clientY - y0;
            y0 = null;
            if (dy < -16) {
              kHide();
              return;
            }
            kHide();
            try {
              window.openApp("kakaotalk", "KakaoTalk");
              window.openKakaoChat("sion_kakao");
            } catch (_) {}
          });
          kel.addEventListener("pointercancel", () => {
            y0 = null;
          });
        }
        window.showKkBanner = function (name, text) {
          if (!kel) kBuild();
          const was = kel.classList.contains("show");
          const html =
            '<span class="avw"><img class="av" src="riku-10.jpg" alt="" decoding="sync"><img class="ai" src="KakaoTalk_logo.svg" alt="" decoding="sync"></span>' +
            '<div class="tx"><div class="t1"><span>' +
            esc(name) +
            "</span><small>ตอนนี้</small></div>" +
            '<div class="t2">' +
            esc(text) +
            "</div></div>";
          if (kel.dataset.html !== html) {
            kel.innerHTML = html;
            kel.dataset.html = html;
          }
          kel.classList.remove("bump");
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              kel.classList.add("show");
              if (was) kel.classList.add("bump");
            }),
          );
          clearTimeout(ktimer);
          ktimer = setTimeout(kHide, 4500);
        };
        const _k = window.openKakaoChat;
        if (typeof _k === "function")
          window.openKakaoChat = function () {
            kHide();
            return _k.apply(this, arguments);
          };
      })();
    </script>
