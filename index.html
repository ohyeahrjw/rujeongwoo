            held.push(k);
          }
        });
        const a = el.animate(frames, {
          duration: ms,
          easing: ease || EASE,
          fill: "forwards",
        });
        const a2 = lin
          ? el.animate(lin, {
              duration: ms,
              easing: "linear",
              fill: "forwards",
            })
          : null;
        const m = { over: false };
        if (phoneEl) phoneEl.classList.add("moving");
        m.end = () => {
          if (m.over) return;
          m.over = true;
          motions.delete(m);
          if (!motions.size && phoneEl) phoneEl.classList.remove("moving");
          if (phoneEl) phoneEl.classList.add("no-tr"); /* temporarily */
          held.forEach((k) => {
            el.style[k] = "";
          });
          try {
            done && done();
          } catch (e) {} /* settle the real CSS state first ... */
          try {
            a.cancel();
          } catch (e) {} /* ... then drop the animation: nothing visibly changes */
          try {
            a2 && a2.cancel();
          } catch (e) {}
          if (phoneEl) {
            void phoneEl.offsetWidth;
            phoneEl.classList.remove("no-tr");
          } /* perform a flush with transitions disabled, then re-enable them */
        };
        a.onfinish = m.end;
        motions.add(m);
        return m;
      }
      function settleMotion() {
        [...motions].forEach((m) => m.end());
      }
      function iconTf() {
        const ph = document.querySelector(".phone");
        const k = Math.max(lastIcon.k, 0.12);
        return (
          "translate(" +
          (lastIcon.x - ph.offsetWidth / 2) +
          "px," +
          (lastIcon.y - ph.offsetHeight / 2) +
          "px) scale(" +
          k +
          ")"
        );
      }

      function showScreen(id) {
        const target = document.getElementById(id);
        if (!target) return;
        settleMotion();
        if (window.igCmClose) window.igCmClose(true);
        target.classList.remove("leaving");
        const wasActive = target.classList.contains("active");
        const prev = [...document.querySelectorAll(".screen.active")].filter(
          (s) => s !== target,
        );
        const dets = [...document.querySelectorAll(DETAIL_SEL)].filter((d) =>
          d.classList.contains("active"),
        );
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        dets.forEach((d) => d.classList.remove("active"));
        if (wasActive && !prev.length) {
          target.classList.add("active");
          return;
        }

        const toHome = id === "home-screen";
        const opening =
          !toHome &&
          lastIcon &&
          Date.now() - lastIcon.t < 1500 &&
          prev.some((s) => s.id === "home-screen");
        const closing =
          toHome &&
          lastIcon &&
          prev.length &&
          !prev.some(
            (s) =>
              s.id === "home-screen" ||
              s.id === "lock-screen" ||
              s.id === "passcode-screen",
          );
        const R = "80px";
        const unlock = (el) => () => el.classList.remove("noanim");

        target.classList.add(
          "noanim",
          "active",
        ); /* CSS state changes instantly; the animation does all the visible motion */

        if (closing) {
          const tf = iconTf();
          const ph = phoneEl || document.querySelector(".phone");
          const PW = ph.offsetWidth,
            PH = ph.offsetHeight;
          const kk = Math.max(lastIcon.k, 0.12);
          const vCrop = Math.max(
            0,
            (PH - PW) / 2,
          ); /* trim the top and bottom */
          const rIcon = 0.2237 * PW + "px";
          const ic = lastIcon.el;
          const iw = Math.max(lastIcon.k * PW, 1);
          /* scale it to rectangular */
          const mkOverlay = () => {
            if (!ic) return null;
            const ov = document.createElement("div");
            ov.className = "fold-icon";
            ov.style.cssText =
              "position:absolute;left:0;top:" +
              vCrop +
              "px;width:" +
              PW +
              "px;height:" +
              PW +
              "px;overflow:hidden;pointer-events:none;z-index:99999;border-radius:" +
              rIcon +
              ";opacity:0";
            const cl = ic.cloneNode(true);
            cl.removeAttribute("id");
            cl.style.cssText +=
              ";position:absolute;left:0;top:0;margin:0;opacity:1;width:" +
              iw +
              "px;height:" +
              iw +
              "px;transform-origin:0 0;transform:scale(" +
              PW / iw +
              ")";
            ov.appendChild(cl);
            return ov;
          };
          /* keep hidden */
          const ovs = [];
          prev.concat(dets).forEach((el) => {
            const o = mkOverlay();
            if (o) {
              el.appendChild(o);
              ovs.push(o);
            }
          });
          if (ic) ic.style.opacity = "0";
          const D = 460;
          const FOLD = "cubic-bezier(.3,.05,.2,1)"; /* gradual scaling */
          prev.concat(dets).forEach((el) => {
            if (el.classList.contains("screen")) el.classList.add("leaving");
            el.classList.add("noanim");
            el.style.zIndex = "30";
            el.style.overflow = "hidden";
            const clip = el.animate(
              [
                { clipPath: "inset(0px 0px 0px 0px round 0px)", offset: 0 },
                { clipPath: "inset(0px 0px 0px 0px round 56px)", offset: 0.18 },
                {
                  clipPath:
                    "inset(" +
                    vCrop +
                    "px 0px " +
                    vCrop +
                    "px 0px round " +
                    rIcon +
                    ")",
                  offset: 0.88,
                },
                {
                  clipPath:
                    "inset(" +
                    vCrop +
                    "px 0px " +
                    vCrop +
                    "px 0px round " +
                    rIcon +
                    ")",
                  offset: 1,
                },
              ],
              {
                duration: D,
                easing: "cubic-bezier(.4,0,.2,1)",
                fill: "forwards",
              },
            );
            motion(
              el,
              [
                { transform: "none", offset: 0 },
                { transform: tf, offset: 1 },
              ],
              D,
              () => {
                try {
                  clip.cancel();
                } catch (e) {}
                el.querySelectorAll(":scope > .fold-icon").forEach((o) =>
                  o.remove(),
                );
                el.classList.remove("leaving", "noanim");
                el.style.zIndex = "";
                el.style.overflow = "";
              },
              /* the card reamins solid */
              [
                { opacity: 1, offset: 0 },
                { opacity: 1, offset: 0.82 },
                { opacity: 0, offset: 1 },
              ],
              FOLD,
            );
          });
          /* app content overlay icon */
          ovs.forEach((o) =>
            o.animate(
              [
                { opacity: 0, offset: 0 },
                { opacity: 0, offset: 0.3 },
                { opacity: 1, offset: 0.68 },
                { opacity: 1, offset: 1 },
              ],
              { duration: D, easing: "linear", fill: "forwards" },
            ),
          );
          /* actual icon appear */
          let icA = null;
          if (ic)
            icA = ic.animate(
              [
                { opacity: 0, offset: 0 },
                { opacity: 0, offset: 0.78 },
                { opacity: 1, offset: 1 },
              ],
              { duration: D, fill: "forwards", easing: "linear" },
            );
          /* homesccreen bg*/
          motion(
            target,
            [
              {
                transform: "scale(1.03)",
                filter: "blur(10px)",
                opacity: 1,
                offset: 0,
              },
              {
                transform: "scale(1.05)",
                filter: "blur(24px)",
                opacity: 1,
                offset: 0.3,
              },
              {
                transform: "scale(1.03)",
                filter: "blur(18px)",
                opacity: 1,
                offset: 0.6,
              },
              { transform: "none", filter: "blur(0px)", opacity: 1, offset: 1 },
            ],
            640,
            () => {
              unlock(target)();
              if (ic) ic.style.opacity = "";
              try {
                icA && icA.cancel();
              } catch (e) {}
            },
          );
          lastIcon = null;
        } else if (opening) {
          const tf = iconTf();
          const br = getComputedStyle(target).borderRadius || "0px";
          prev.forEach((el) => {
            el.classList.add("leaving", "noanim");
            motion(
              el,
              [
                { transform: "none", opacity: 1 },
                { transform: "scale(.92)", opacity: 0 },
              ],
              480,
              () => el.classList.remove("leaving", "noanim"),
            );
          });
          motion(
            target,
            [
              { transform: tf, opacity: 0, borderRadius: R, offset: 0 },
              { opacity: 1, offset: 0.2 },
              { transform: "none", opacity: 1, borderRadius: br, offset: 1 },
            ],
            480,
            unlock(target),
          );
        } else {
          prev.forEach((el) => el.classList.add("leaving"));
          motion(
            target,
            [
              { opacity: 0, transform: "scale(.97)" },
              { opacity: 1, transform: "none" },
            ],
            380,
            () => {
              target.classList.remove("noanim");
              prev.forEach((el) => el.classList.remove("leaving"));
            },
          );
        }
      }

            requestAnimationFrame(() =>
              requestAnimationFrame(() => sh.classList.add("open")),
            );

          .classList.toggle("dark", musicNPOpen && !!cur);

      function musicRefresh() {
        if (document.querySelector(".music-app")) renderMusic();
      }

      function musicProgress() {
        const seek = document.getElementById("mp-seek");
        if (!seek) return;
        const d = musicAudio.duration || 0,
          c = musicAudio.currentTime || 0;
        if (!musicSeeking) {
          seek.max = d || 1;
          seek.value = c;
        }
        seek.style.setProperty("--p", (d ? (c / d) * 100 : 0) + "%");
        document.getElementById("mp-cur").textContent = fmtTime(c);
        document.getElementById("mp-rem").textContent = "-" + fmtTime(d - c);
        if (
          d &&
          "mediaSession" in navigator &&
          navigator.mediaSession.setPositionState
        ) {
          try {
            navigator.mediaSession.setPositionState({
              duration: d,
              position: Math.min(c, d),
              playbackRate: 1,
            });
          } catch (e) {}
        }
      }

      function musicSeekTo(v) {
        musicSeeking = true;
        musicAudio.currentTime = parseFloat(v);
        musicProgress();
      }

      function musicSetMedia() {
        if (!("mediaSession" in navigator) || musicIdx < 0) return;
        const t = musicTracks[musicIdx];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t.title,
          artist: t.artist,
          album: t.album || "",
          artwork: t.cover ? [{ src: t.cover }] : [],
        });
      }

      function musicPlay(i) {
        if (i < 0 || i >= musicTracks.length) return;
        musicIdx = i;
        musicAudio.src = musicTracks[i].src;
        const pr = musicAudio.play();
        if (pr && pr.catch)
          pr.catch((e) => {
            if (e.name === "NotAllowedError") musicToast("แตะปุ่มเล่นอีกครั้ง");
          });
        musicSetMedia();
        musicRefresh();
      }

      function musicRowTap(i) {
        i === musicIdx ? musicToggle() : musicPlay(i);
      }

      function musicToggle() {
        if (musicIdx < 0) return musicPlay(0);
        if (musicAudio.paused) {
          const pr = musicAudio.play();
          if (pr && pr.catch) pr.catch(() => {});
        } else musicAudio.pause();
      }

      function musicPlayAll(shuffle) {
        musicShuffle = shuffle;
        musicPlay(shuffle ? Math.floor(Math.random() * musicTracks.length) : 0);
      }

      function musicNext(auto) {
        const n = musicTracks.length;
        if (!n) return;
        if (auto && musicRepeat === "one") {
          musicAudio.currentTime = 0;
          musicAudio.play();
          return;
        }
        let i;
        if (musicShuffle && n > 1) {
          do {
            i = Math.floor(Math.random() * n);
          } while (i === musicIdx);
        } else {
          i = musicIdx + 1;
          if (i >= n) {
            if (auto && musicRepeat === "off") {
              musicAudio.pause();
              musicAudio.currentTime = 0;
              musicRefresh();
              return;
            }
            i = 0;
          }
        }
        musicPlay(i);
      }

      function musicPrev() {
        if (musicAudio.currentTime > 3) {
          musicAudio.currentTime = 0;
          return;
        }
        musicPlay((musicIdx - 1 + musicTracks.length) % musicTracks.length);
      }

      function musicToggleShuffle() {
        musicShuffle = !musicShuffle;
        renderMusic();
      }
      function musicCycleRepeat() {
        musicRepeat = { off: "all", all: "one", one: "off" }[musicRepeat];
        renderMusic();
      }
      function musicOpenNP() {
        if (musicIdx < 0) return;
        musicNPOpen = true;
        renderMusic(true);
      }
      function musicCloseNP() {
        const sh = document.getElementById("np-sheet");
        musicNPOpen = false;
        document.getElementById("app-screen").classList.remove("dark");
        if (sh) {
          sh.classList.remove("open");
          setTimeout(renderMusic, 420);
        } else renderMusic();
      }

      function musicAddFiles(files) {
        Array.from(files).forEach((f) =>
          musicTracks.push({
            title: f.name.replace(/\.[^.]+$/, ""),
            artist: "Local Files",
            src: URL.createObjectURL(f),
            cover: "",
          }),
        );
        renderMusic();
      }

      musicAudio.addEventListener("play", musicRefresh);
      musicAudio.addEventListener("pause", musicRefresh);
      musicAudio.addEventListener("ended", () => musicNext(true));
      musicAudio.addEventListener("timeupdate", musicProgress);
      musicAudio.addEventListener("loadedmetadata", musicProgress);
      musicAudio.addEventListener("error", () => {
        if (musicIdx >= 0 && musicAudio.getAttribute("src"))
          musicToast("ไม่พบไฟล์เพลง: " + musicTracks[musicIdx].title);
      });

      if ("mediaSession" in navigator) {
        const ms = navigator.mediaSession;
        ms.setActionHandler("play", () => musicToggle());
        ms.setActionHandler("pause", () => musicToggle());
        ms.setActionHandler("previoustrack", () => musicPrev());
        ms.setActionHandler("nexttrack", () => musicNext(false));
        try {
          ms.setActionHandler("seekto", (d) => {
            musicAudio.currentTime = d.seekTime;
          });
        } catch (e) {}
      }

                 t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                 return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
               };
               const pick = (a) => a[Math.floor(rnd() * a.length)];
               /* og: riku = a japanese acq/ shion = a semi-inf korean */
               let isSion = false;
               try {
                 isSion = !!(
                   igProfiles.sion &&
                   igProfiles.sion.posts.some((p) => p.img === key)
                 );
               } catch (e) {}
               /* onri-1 photos of a cp; onri-2 → cp photos */
               if (CM.SPECIAL["onri-2.jpg"] && !CM.SPECIAL["onri-1.jpg"])
                 CM.SPECIAL["onri-1.jpg"] = CM.SPECIAL["onri-2.jpg"];
               const special = CM.SPECIAL[key] || null;
               /* base value */
               const want = special
                 ? 3 + Math.floor(rnd() * 6)
                 : isSion
                   ? 4 + Math.floor(rnd() * 9)
                   : 2 + Math.floor(rnd() * 5);
               const n = Math.min(base, want),
                 out = [],
                 usedN = {},
                 now = Date.now();
               /* random sampling wt replacement */
               const shuf = (a) => {
                 const b = a.slice();
                 for (let i = b.length - 1; i > 0; i--) {
                   const j = Math.floor(rnd() * (i + 1));
                   const t = b[i];
                   b[i] = b[j];
                   b[j] = t;
                 }
                 return b;
               };
               const groups = special ? [special] : isSion ? CM.SION : [CM.RIKU];
               const bag = groups.map((g) => ({
                 g: g,
                 t: shuf(g.t),
                 n: shuf(g.n),
               }));
               const takeGroup = () => {
                 const live = bag.filter((x) => x.t.length && x.n.length);
                 if (!live.length) return null;
                 if (live.length === 1) return live[0];
                 const tot = live.reduce((m, x) => m + (x.g.w || 1), 0);
                 let r = rnd() * tot;
                 for (const x of live) {
                   const w = x.g.w || 1;
                   if (r < w) return x;
                   r -= w;
                 }
                 return live[0];
               };
               for (let i = 0; i < n; i++) {
                 const x = takeGroup();
                 if (!x) break;
                 const txt = x.t.pop();
                 /* ppl featured in my profile: riku often */
                 let f =
                   friends.length && rnd() < (isSion && !special ? 0.06 : 0.12)
                     ? friends[Math.floor(rnd() * friends.length)]
                     : null;
                 if (f && usedN[f.username]) f = null;
                 let nm = "";
                 if (f) nm = f.username;
                 else {
                   do {
                     nm =
                       x.n.pop() +
                       (rnd() < 0.3 ? Math.floor(rnd() * 90 + 10) : "");
                   } while (usedN[nm] && x.n.length);
                 }
                 usedN[nm] = 1;
                 /* shi: frequently at first/ rk: sparse */
                 const gap = isSion && !special ? 6 + rnd() * 40 : 20 + rnd() * 90;
                 out.push({
                   text: txt,
                   name: nm,
                   avatar: f ? f.avatar : "",
                   t: now - (n - i) * gap * 60000,
                   likes: isSion
                     ? Math.floor(rnd() * rnd() * 60)
                     : Math.floor(rnd() * rnd() * 6),
                   liked: false,
                   seed: true,
                 });
               }
               window.igCmSeed[seedKey] = out;
             }
             const seeds = window.igCmSeed[seedKey];
             const w = document.createElement("div");
             w.className = "ig-cmw";
             w.innerHTML =
               '<div class="ig-cm-shade"></div><div class="ig-cm-panel"><div class="ig-cm-grab"></div>' +
               '<div class="ig-cm-h">Comment</div><div class="ig-cm-list"></div>' +
               '<div class="ig-cm-in"><img alt=""><input type="text" maxlength="300" autocomplete="off" placeholder="Add a comment..."><button type="button" disabled>Post</button></div></div>';
             scr.appendChild(w);
             const list = w.querySelector(".ig-cm-list"),

             w.querySelector(".ig-cm-in img").src = me.avatar;
             const ago = (t) => {
               const s = Math.floor((Date.now() - t) / 1000);
               return s < 60
                 ? "Now"

                   ? Math.floor(s / 60) + " Minute"

               "</span>" +
               IC.info +
               "</div>" +
               '<button class="gl round">' +
               IC.trash +
               "</button></div>" +
               homeIndicator;
             /* ===== Zoom on images ===== */
             const st = $("#pv-stage"),
               zimg = $("#pv-img");
             const Z = { s: 1, x: 0, y: 0 },
               MAXS = 5;
             const ptrs = new Map();
             let pinch = null,
               drag = null,
               x0 = null,
               moved = 0,
               tapT = 0,
               tapX = 0,
               tapY = 0,
               downT = 0;
             const phoneSc = () => {
               const ph = document.querySelector(".phone");
               return ph
                 ? ph.getBoundingClientRect().width / ph.offsetWidth || 1
                 : 1;
             };
             const zApply = (anim) => {
               zimg.style.transition = anim
                 ? "transform .28s cubic-bezier(.2,.8,.3,1)"
                 : "none";
               zimg.style.transform =
                 Z.s === 1 && !Z.x && !Z.y
                   ? ""
                   : "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.s + ")";
             };
             const zClamp = () => {
               if (Z.s <= 1) {
                 Z.x = Z.y = 0;
                 return;
               }
               const mx = Math.max(
                 0,
                 (zimg.offsetWidth * Z.s - st.clientWidth) / 2,
               );
               const my = Math.max(
                 0,
                 (zimg.offsetHeight * Z.s - st.clientHeight) / 2,
               );
               Z.x = Math.min(mx, Math.max(-mx, Z.x));
               Z.y = Math.min(my, Math.max(-my, Z.y));
             };
             const zAt = (ns, px, py) => {
               /* zoom  while keeping the point */
               ns = Math.min(MAXS, Math.max(1, ns));
               const sc = phoneSc(),
                 r = zimg.getBoundingClientRect();
               const c0x = r.left + r.width / 2 - Z.x * sc,
                 c0y = r.top + r.height / 2 - Z.y * sc,
                 k = ns / Z.s;
               Z.x = (px - c0x - (px - c0x - Z.x * sc) * k) / sc;
               Z.y = (py - c0y - (py - c0y - Z.y * sc) * k) / sc;
               Z.s = ns;
               zClamp();
             };
             window.__pvReset = () => {
               Z.s = 1;
               Z.x = Z.y = 0;
               ptrs.clear();
               pinch = drag = null;
               zimg.style.transition = "none";
               zimg.style.transform = "";
             };
             zimg.draggable = false;
             st.addEventListener("pointerdown", (e) => {
               try {
                 st.setPointerCapture(e.pointerId);
               } catch (_) {}
               ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
               if (ptrs.size === 1) {
                 x0 = e.clientX;
                 moved = 0;
                 downT = Date.now();
                 drag = { x: e.clientX, y: e.clientY };
               }
               if (ptrs.size === 2) {
                 const [a, b] = [...ptrs.values()];
                 pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: Z.s };
                 drag = null;
               }
             });
             st.addEventListener("pointermove", (e) => {
               const p = ptrs.get(e.pointerId);
               if (!p) return;
               const prevX = p.x,
                 prevY = p.y;
               p.x = e.clientX;
               p.y = e.clientY;
               moved = Math.max(
                 moved,
                 Math.hypot(e.clientX - (x0 === null ? e.clientX : x0), 0),
               );
               if (ptrs.size >= 2 && pinch) {
                 const [a, b] = [...ptrs.values()],
                   d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
                 zAt((pinch.s * d) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
                 zApply(false);
               } else if (drag && Z.s > 1) {
                 const sc = phoneSc();
                 Z.x += (e.clientX - prevX) / sc;
                 Z.y += (e.clientY - prevY) / sc;
                 zClamp();
                 zApply(false);
               }
             });
             const pEnd = (e) => {
               const had = ptrs.has(e.pointerId);
               ptrs.delete(e.pointerId);
               if (!had) return;
               if (pinch && ptrs.size < 2) {
                 pinch = null;
                 if (Z.s < 1.05) {
                   Z.s = 1;
                   Z.x = Z.y = 0;
                   zApply(true);
                 }
                 drag = null;
                 if (ptrs.size === 1) {
                   const q = [...ptrs.values()][0];
                   drag = { x: q.x, y: q.y };
                   x0 = null;
                 }
                 return;
               }
               if (ptrs.size) return;
               const dx = e.clientX - (x0 === null ? e.clientX : x0),
                 dy = drag ? e.clientY - drag.y : 0;
               drag = null;
               const isTap =
                 Date.now() - downT < 300 && Math.abs(dx) < 8 && Math.abs(dy) < 8;
               if (isTap) {
                 const now = Date.now();
                 if (
                   now - tapT < 320 &&
                   Math.hypot(e.clientX - tapX, e.clientY - tapY) < 30
                 ) {
                   /* Double-tap */
                   tapT = 0;
                   if (Z.s > 1.05) {
                     Z.s = 1;
                     Z.x = Z.y = 0;
                   } else zAt(2.6, e.clientX, e.clientY);
                   zApply(true);
                 } else {
                   tapT = now;
                   tapX = e.clientX;
                   tapY = e.clientY;
                 }
               } else if (Z.s <= 1.02 && x0 !== null) {
                 if (dx < -45) pvGo(pvIdx + 1);
                 else if (dx > 45)
                   pvGo(pvIdx - 1); /* swipe */
               }
               x0 = null;
             };

             st.addEventListener("pointercancel", pEnd);

                 e.preventDefault();
                 zAt(

                   e.clientY,
                 );
                 zApply(false);
               },

             el.className = "ig-sv";

             igSv = {

               i: startAt,
               el,
               timer: null,
               t0: 0,
               left: 0,
               paused: false,
               sheet: false,
             };
             igSvShow();
             /* gestures */
             let sx = 0,
               sy = 0,
               st = 0,
               moved = false,
               dy = 0;
             el.addEventListener("mousedown", (e) => {
               if (
                 e.target.closest(".ig-sv-react, .ig-sv-quick, .ig-sv-foot > span")
               )
                 e.preventDefault();
             });
             el.addEventListener("pointerdown", (e) => {
               if (igSv && igSv.sheet) return;
               if (
                 e.target.closest(
                   ".ig-sv-foot, .ig-sv-sheet, .ig-sv-head svg, .ig-sv-react, .ig-sv-quick",
                 )
               )
                 return;
               sx = e.clientX;
               sy = e.clientY;
               st = Date.now();
               moved = false;
               dy = 0;
               igSvPause(true);
               try {
                 el.setPointerCapture(e.pointerId);
               } catch (_) {}
             });
             el.addEventListener("pointermove", (e) => {
               if (!st) return;
               dy = e.clientY - sy;
               if (Math.abs(dy) > 8) moved = true;
               if (dy > 0 && moved)
                 el.style.transform =
                   "translateY(" +
                   dy * 0.6 +
                   "px) scale(" +
                   (1 - Math.min(dy, 300) / 1800) +
                   ")";
             });
             const end = (e) => {
               if (!st) return;
               const held = Date.now() - st,
                 x = e.clientX - el.getBoundingClientRect().left,
                 w = el.clientWidth;
               st = 0;
               el.style.transform = "";
               if (moved && dy > 90) {
                 closeIgStory();
                 return;
               }
               igSvPause(false);
               if (!moved && held < 220) {
                 x < w * 0.3 ? igSvStep(-1) : igSvStep(1);
               }
             };
             el.addEventListener("pointerup", end);
             el.addEventListener("pointercancel", () => {
               st = 0;
               el.style.transform = "";
               igSvPause(false);
             });
           };

               r = el.getBoundingClientRect(),

               const f = document.createElement("div");

                 "px;font-size:" +

                 "px;--dx:" +
                 ((Math.random() - 0.5) * 150).toFixed(0) +

                 "px;--rot:" +

           function igNotifyAway(text) {

           function igRikuReply(text, node) {

           function igBurst(el, ev) {

               r = el.getBoundingClientRect();

               ev && ev.clientX != null

                 : r.width / sc / 2;
             const y =
               ev && ev.clientY != null
                 ? (ev.clientY - r.top) / sc
                 : r.height / sc / 2;
             const rot = (Math.random() * 30 - 15).toFixed(1) + "deg",

               id +

               id +
               ')" stroke-width="1.2" stroke-linejoin="round"/></svg>';
             el.appendChild(b);

                 { transform: t + "scale(0)", opacity: 0, offset: 0 },
                 { transform: t + "scale(1.25)", opacity: 1, offset: 0.2 },

           const phLog = [];

           function phCalls() {
             const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
             let unk = null;
             try {
               unk = JSON.parse(localStorage.getItem("ph_unk2") || "null");
             } catch (e) {}
             if (!unk) {
               unk = {
                 num: "+82 10 " + rnd(1000, 9999) + " " + rnd(1000, 9999),
                 days: rnd(4, 9),
                 h: rnd(8, 22),
                 m: rnd(0, 59),
               };
               try {
                 localStorage.setItem("ph_unk2", JSON.stringify(unk));
               } catch (e) {}
             }
             const at = (days, h, m) => {
               const d = new Date();
               d.setDate(d.getDate() - days);
               d.setHours(h, m, 0, 0);
               return d;
             };
             // เจ้าหญิง (โทรออก) อยู่ล่าสุดเสมอ: เมื่อวาน ส่วนรายการอื่นเก่ากว่า (>= 3 วันก่อน)

                 name: "เจ้าหญิง",
                 sub: "มือถือ",
                 type: "out",
                 when: at(1, 22, 14),
               },
               { name: "แม่", sub: "มือถือ", type: "in", when: at(3, 18, 42) },
               {
                 name: unk.num,
                 sub: "เกาหลีใต้",
                 type: "miss",
                 when: at(unk.days, unk.h, unk.m),
               },
               { name: "โอชียอน", sub: "มือถือ", type: "in", when: at(14, 20, 5) },
               { name: "ยูชิ", sub: "มือถือ", type: "in", when: at(5, 19, 30) },
               { name: "แดยอง", sub: "มือถือ", type: "in", when: at(10, 13, 48) },
             ];
             phLog.forEach((l) =>
               calls.push({
                 name: l.name,
                 sub: l.sub,
                 type: l.type || "out",
                 when: new Date(l.when),
               }),
             );
             calls.sort((a, b) => b.when - a.when);
             return calls;
           }

           function phWhen(d) {
             const t0 = new Date();
             t0.setHours(0, 0, 0, 0);
             const d0 = new Date(d);
             d0.setHours(0, 0, 0, 0);
             const days = Math.round((t0 - d0) / 86400000);
             if (days <= 0)
               return (
                 String(d.getHours()).padStart(2, "0") +
                 ":" +
                 String(d.getMinutes()).padStart(2, "0")
               );
             if (days === 1) return "เมื่อวาน";
             if (days < 7) return "วัน" + TH_D[d.getDay()];
             return (
               String(d.getDate()).padStart(2, "0") +
               "/" +
               String(d.getMonth() + 1).padStart(2, "0") +
               "/" +
               d.getFullYear()
             );
           }

               (r) => r !== call.rec,
             ); /* ไม่นับสายนี้เอง */
             const last = h[h.length - 1];
             const recent = h.filter((r) => now - r.t <= CALL_CTX.freqWin);
             const excuse =
               !!last &&
               !last.ok &&
               now - last.t <= CALL_CTX.missWin &&
               Math.random() < CALL_CTX.excuseChance;
             const prev = recent.length;
             return {
               excuse: excuse,
               /* ถ้าเพิ่งตำหนิว่าทำไมไม่รับสาย จะไม่ขอโทษที่โทรซ้ำในสายเดียวกัน (สองบทนี้ขัดกัน) */
               level: excuse
                 ? 0
                 : prev >= CALL_CTX.heavyFrom
                   ? 2
                   : prev >= CALL_CTX.repeatFrom
                     ? 1
                     : 0,
               talked: recent.some(
                 (r) => r.ok,
               ) /* เคยคุยกันจริงในช่วงนี้ → ใช้คำว่า "เมื่อกี้คุยกันไป" ได้ */,
             };
           }
           /* แทรกบทถามที่ไม่รับสาย/บทโทรซ้ำ (ชิอนพูดก่อน อีกฝ่ายตอบ) หลังทักทายตอนรับสาย แล้วค่อยเข้าบทสนทนาเดิม */
           function callContext(sc, key, name, ctx) {
             if (!ctx.excuse && !ctx.level) return sc;
             const at = CALL_GREET[key]
               ? 3
               : 2; /* มีทักทายคู่ (them+me) = แทรกหลังบรรทัดที่ 3, สายทั่วไป = หลังอีกฝ่ายทักบรรทัดแรก */
             const h = callHour();
             const rest = sc
               .slice(at)
               .map((l, i) =>
                 i === 0 ? [Math.max(l[0], 2.8)].concat(l.slice(1)) : l,
               );
             const ins = [];
             const add = (set, id, ans) => {
               const okf = (q) =>
                 callInHrs(q, h) &&
                 !(q.t && q.t === sc.t) &&
                 (ctx.talked || !/คุยกัน/.test(q[1]));
               let pl = set[key] || set["*"];
               if (!pl.some(okf))
                 pl =
                   set[
                     "*"
                   ]; /* ไม่มีบทของคนนี้ที่เข้ากับเวลา/เรื่อง → ใช้บททั่วไป */
               const p = callCtxPick(pl, key + id, okf);
               ins.push([2.8, "me", p[0]], [3.0, "them", p[1]]);
               /* บทหลักขึ้นต้นด้วยอีกฝ่ายพูดต่อ → ชิอนต้องตอบก่อน (ถ้าบทหลักขึ้นด้วยชิอนอยู่แล้ว เช่นสายทั่วไป ไม่ต้องเติม) */
               if (rest[0] && rest[0][1] === "them")
                 ins.push([2.6, "me", ans[key] || ans["*"]]);
             };
             if (ctx.excuse) add(CALL_EXCUSE, "x", CALL_ACK);
             else
               add(
                 ctx.level === 2 ? CALL_REPEAT_HEAVY : CALL_REPEAT,
                 ctx.level === 2 ? "h" : "r",
                 CALL_WHY,
               );
             const out = sc.slice(0, at).concat(ins, rest);
             if ("bye" in sc) out.bye = sc.bye;
             if (sc.t) out.t = sc.t;
             return out;
           }

           const callLast = {};
           function callPick(name) {
             if (name.charAt(0) === "+")
               return CALL_SCRIPTS["+"]; /* เบอร์แปลก: บทเดิมเสมอ */
             const key =
               name !== "+" && CALL_SCRIPTS.hasOwnProperty(name) ? name : "*";
             const pool = [CALL_SCRIPTS[key]].concat(CALL_MORE[key] || []);
             const ctx = callCtx(name),
               h = callHour(),
               ctxOn = ctx.excuse || ctx.level > 0;
             let idx = pool
               .map((_, i) => i)
               .filter((i) => callInHrs(pool[i], h) && !(ctxOn && pool[i].plain));
             if (!idx.length) idx = pool.map((_, i) => i);
             let i;
             do {
               i = idx[Math.floor(Math.random() * idx.length)];
             } while (idx.length > 1 && i === callLast[key]);
             callLast[key] = i;
             return callContext(callGreet(pool[i], key), key, name, ctx);
           }

           const callIc = {
             mic: ic(
               '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M4 4l16 16"/>',
               1.9,
             ),
             spk: ic(
               '<path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
               1.9,
             ),
             add: ic('<path d="M12 5v14M5 12h14"/>', 2),
             video: ic(
               '<rect x="3" y="6.5" width="12.5" height="11" rx="3"/><path d="m15.5 11 5-3v8l-5-3"/>',
               1.9,
             ),
             end: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.2c-3.2 0-6.1 1-8 2.6-.6.5-.7 1.4-.3 2l1 1.5c.4.6 1.2.8 1.8.5l2.2-1c.5-.2.8-.7.8-1.2v-1.1c1.2-.4 2.7-.4 3.9 0v1.1c0 .5.3 1 .8 1.2l2.2 1c.6.3 1.4.1 1.8-.5l1-1.5c.4-.6.3-1.5-.3-2-1.9-1.6-4.8-2.6-8-2.6z"/></svg>',
           };
           const CALL_KEYS = [
             ["1", ""],
             ["2", "ABC"],
             ["3", "DEF"],
             ["4", "GHI"],
             ["5", "JKL"],
             ["6", "MNO"],
             ["7", "PQRS"],
             ["8", "TUV"],
             ["9", "WXYZ"],
             ["*", ""],
             ["0", "+"],
             ["#", ""],
           ];
           /* อีกฝ่ายวางสายเองหลังจบบทสนทนา: รอกี่มิลลิวินาที [ต่ำสุด, สูงสุด] */
           const CALL_HANGUP_WAIT = [4000, 7000];
           const call = { on: false, timers: [] };
           const callRnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
           const snd = (n, ...a) => {
             try {
               if (window.SFX && SFX[n]) SFX[n](...a);
             } catch (e) {}
           }; /* เสียงสาย */
           const callLater = (fn, ms) => {
             const id = setTimeout(fn, ms);
             call.timers.push(id);
             return id;
           };
           const callClear = () => {
             call.timers.forEach(clearTimeout);
             call.timers = [];
             clearInterval(call.tick);
           };
           const callStat = (t) => {
             const el = $("#call-stat");
             if (el) el.textContent = t;
           };
           const callFmt = (sec) => {
             const p = (n) => String(n).padStart(2, "0"),
               h = Math.floor(sec / 3600);
             return (
               (h ? h + ":" : "") +
               p(Math.floor(sec / 60) % 60) +
               ":" +
               p(sec % 60)
             );
           };

           window.phCall = function (i) {
             const c = ph.rows && ph.rows[i];
             if (c) callStart(c.name, c.sub);
           };

           function callStart(name, sub, opt) {
             if (call.on || (inc.on && !(opt && opt.incoming)))
               return; /* สายเข้ากำลังดังอยู่ → ยังโทรออกไม่ได้ */
             opt = opt || {};
             callClear();
             Object.assign(call, {
               on: true,
               ending: false,
               byeSaid: false,
               name,
               sub,
               answered: false,
               mute: false,
               spk: false,
               muteHint: false,
               digits: "",
               sec: 0,
               dir: opt.incoming ? "in" : "out",
               kind: opt.kind || "",
               failed: false,
               tDial: Date.now(),
               sc0: null,
             });
             /* จดประวัติการโทร (ok = รับสายแล้ว) ไว้ใช้ทำบท "เมื่อกี้ไม่ว่าง/เมื่อกี้ก็โทรมาแล้ว" */
             if (opt.incoming)
               call.rec = null; /* สายเข้าไม่นับเป็นประวัติ "เราโทรออก" */
             else {
               call.rec = { t: Date.now(), ok: false };
               (CALL_HIST[name] = CALL_HIST[name] || []).push(call.rec);
               if (CALL_HIST[name].length > 20) CALL_HIST[name].shift();
             }
             let el = document.getElementById("call-screen");
             if (!el) {
               el = document.createElement("div");
               el.id = "call-screen";
               document.querySelector(".phone").appendChild(el);
             }
             el.className =
               "call-screen ring" + (name === "เจ้าหญิง" ? " pink" : "");
             el.style.removeProperty("--poster");
             if (IN_AV[name]) {
               /* มีรูปผู้โทร → ใช้เป็นพื้นหลังตอนโทร/คุยสาย */
               el.classList.add("poster");
               el.style.setProperty("--poster", 'url("' + IN_AV[name] + '")');
             }
             const sb = document.querySelector(".status-bar");
             el.innerHTML =
               '<div class="status-bar">' +
               (sb ? sb.innerHTML : "") +
               "</div>" +
               '<div class="call-who"><div class="call-name">' +
               E(name) +
               '</div><div class="call-stat" id="call-stat"></div><div class="call-digits" id="call-digits"></div></div>' +
               '<div class="call-cap" id="call-cap"></div>' +
               '<div class="call-grid">' +
               '<div class="call-b" id="cb-mute" onclick="callMute()"><i>' +
               callIc.mic +
               "</i>ปิดเสียง</div>" +
               '<div class="call-b" onclick="callPad(true)"><i>' +
               phIc.keypad +
               "</i>แป้นเลข</div>" +
               '<div class="call-b" id="cb-spk" onclick="callSpk()"><i>' +
               callIc.spk +
               "</i>ลำโพง</div>" +
               '<div class="call-b" onclick="callNA()"><i>' +
               callIc.add +
               "</i>เพิ่มสาย</div>" +
               '<div class="call-b" onclick="callNA()"><i>' +
               callIc.video +
               "</i>FaceTime</div>" +
               '<div class="call-b" onclick="callNA()"><i>' +
               IC.person +
               "</i>รายชื่อ</div>" +
               "</div>" +
               '<div class="call-pad">' +
               CALL_KEYS.map(
                 (k) =>
                   '<div class="call-key" onclick="callKey(\'' +
                   k[0] +
                   "')\">" +
                   k[0] +
                   "<small>" +
                   k[1] +
                   "</small></div>",
               ).join("") +
               "</div>" +
               '<div class="call-foot"><div class="call-end" onclick="callEnd()">' +
               callIc.end +
               '</div><button class="call-hide" onclick="callPad(false)">ซ่อน</button></div>' +
               '<div class="call-bar"></div>';
             const t = document.querySelector(".clock-time");
             el.querySelectorAll(".clock-time").forEach((x) => {
               if (t) x.textContent = t.textContent;
             });
             call.el = el;
             call.coax = 0;
             /* โทรไปง้อริคุ: ต้องตอบ DM ว่าจะโทรไปง้อก่อน (rkCoax) แล้วกดโทรเองภายในเวลาที่กำหนด → ใช้บทง้อตามระดับ + ริคุรับสายเกือบแน่นอน */
             if (
               !opt.incoming &&
               name === "เจ้าหญิง" &&
               rkCoax &&
               Date.now() - rkCoax.t < CALL_IN.coaxWindow * 1000
             ) {
               call.coax = rkCoax.lv;
               call.sc0 = coaxScript(rkCoax.lv);
             }
             requestAnimationFrame(() =>
               requestAnimationFrame(() => el.classList.add("on")),
             );

             if (opt.incoming) {
               /* เรากดรับสายเอง: ข้ามขั้นตอนโทรออก เข้าบทสนทนาของสายเข้าเลย */
               call.sc0 = incScript(name, opt.kind);
               callLater(callAnswer, 450);
               return;
             }
             callStat("กำลังโทรหา…");
             snd("ringback");
             callLater(() => callStat("กำลังเรียก…"), 1200);
             /* สุ่มผลการโทร: รับสาย 60% / ไม่มีผู้รับสาย 25% / สายไม่ว่าง 15% */
             const r = call.coax
               ? Math.random() < CALL_IN.coaxAnswer
                 ? 0
                 : 0.9
               : Math.random(); /* ง้อ: ริคุรอสายอยู่ รับ ~95% */
             if (r < 0.6) callLater(callAnswer, callRnd(4000, 8000));
             else if (r < 0.85)
               callLater(() => callFail("ไม่มีผู้รับสาย"), callRnd(8000, 11000));
             else callLater(() => callFail("สายไม่ว่าง"), callRnd(2500, 4500));
           }

           function callAnswer() {
             if (!call.on || call.ending) return;
             call.answered = true;
             call.t0 = Date.now();
             if (call.coax) {
               rkCoax = null;
               rkMiss.length = 0;
             } /* ง้อสำเร็จ → หายงอน */
             if (call.rec) call.rec.ok = true;
             snd("ringStop");
             snd("connect");
             call.el.classList.remove("ring");
             callStat("00:00");
             call.tick = setInterval(() => {
               call.sec = Math.floor((Date.now() - call.t0) / 1000);
               callStat(callFmt(call.sec));
             }, 250);
             const sc = call.sc0 || callPick(call.name);
             call.sc = sc;
             let t = 0;
             sc.forEach((l) => {
               t += l[0] * 1000;
               callLater(() => callLine(l[1], l[2]), t);
             });
             /* ไม่มีบทสนทนาต่อแล้ว: อีกฝ่ายเงียบไปครู่หนึ่งแล้ววางสายเอง (ถ้าสคริปต์ไม่ได้จบด้วย 'end' อยู่แล้ว) */
             if (sc[sc.length - 1][1] !== "end")
               callLater(
                 callTheyHangup,
                 t + callRnd(CALL_HANGUP_WAIT[0], CALL_HANGUP_WAIT[1]),
               );
           }

           /* คำลาก่อนวางสาย (อีกฝ่ายพูด) — ใส่ null = ไม่มีคำลา (วางสายเลย) */
           const CALL_BYE = {
             เจ้าหญิง: "ถ้างั้นผมขอวางสายก่อนนะครับพี่ ไว้คุยกันใหม่นะ",
             แม่: "ถ้างั้นแม่ขอวางสายก่อนนะลูก ดูแลตัวเองด้วย",
             "+": null,
             "*": "ถ้างั้นขอวางสายก่อนนะ ไว้คุยกันใหม่",
           };

           function callTheyHangup() {
             if (!call.on || call.ending) return;
             const key = CALL_BYE.hasOwnProperty(call.name)
               ? call.name
               : call.name.charAt(0) === "+"
                 ? "+"
                 : "*";
             /* คำลาเฉพาะบท (sc.bye) มาก่อน ถ้าไม่มีค่อยใช้ CALL_BYE ตามชื่อ */
             const bye = call.sc && "bye" in call.sc ? call.sc.bye : CALL_BYE[key];
             let wait = 0;
             if (bye && !call.byeSaid) {
               call.byeSaid = true;
               callLine("them", bye);
               wait = 2200;
             }
             callLater(() => {
               callLine("nar", "(อีกฝ่ายวางสาย)");
               callLater(callEnd, 1200);
             }, wait);
           }

           function callFail(msg) {
             if (!call.on || call.ending) return;
             call.failed = true;
             call.ending = true;
             callClear();
             call.el.classList.remove("ring");
             call.el.classList.add("fail");
             snd("ringStop");
             snd(msg === "สายไม่ว่าง" ? "busy" : "failed");
             callStat(msg);
             callLater(callFinish, 1500);
           }

           function callLine(who, text) {
             if (!call.on || call.ending) return;
             if (who === "end") return callTheyHangup();
             if (who === "me" && call.mute)
               return; /* ปิดไมค์อยู่ อีกฝ่ายไม่ได้ยิน */
             const cap = $("#call-cap");
             if (!cap) return;
             const d = document.createElement("div");
             d.className = "ln " + who;
             d.innerHTML =
               who === "nar"
                 ? E(text)
                 : "<small>" +
                   (who === "me" ? "ชิอน" : E(call.name)) +
                   "</small>" +
                   E(text);
             cap.appendChild(d);
             while (cap.children.length > 5) cap.removeChild(cap.firstChild);
           }

           window.callMute = function () {
             if (!call.answered && call.on) {
               /* ยังไม่รับสาย ก็กดได้เหมือน iOS */
             }
             call.mute = !call.mute;
             snd("toggle");
             $("#cb-mute").classList.toggle("on", call.mute);
             if (!call.answered || call.ending) return;
             if (call.mute) {
               call.muteHint = false;
               callLater(() => {
                 if (call.mute && call.on && !call.ending) {
                   call.muteHint = true;
                   callLine("them", "ฮัลโหล? ได้ยินไหม…");
                 }
               }, 3500);
             } else if (call.muteHint) {
               call.muteHint = false;
               callLine("them", "อ๋อ ได้ยินแล้ว");
             }
           };
           window.callSpk = function () {
             call.spk = !call.spk;
             snd("toggle");
             $("#cb-spk").classList.toggle("on", call.spk);
             if (call.answered && !call.ending)
               callLine("nar", call.spk ? "(เปิดลำโพง)" : "(ปิดลำโพง)");
           };
           window.callNA = function () {
             musicToast("ยังไม่เปิดใช้งาน");
           };
           window.callPad = function (on) {
             if (call.el) call.el.classList.toggle("pad", on);
           };
           window.callKey = function (k) {
             if (call.digits.length >= 24) return;
             call.digits += k;
             snd("dtmf", k);
             const d = $("#call-digits");
             if (d) d.textContent = call.digits;
           };

           window.callEnd = function () {
             if (!call.on) return;
             if (call.ending && !call.answered) return;
             call.ending = true;
             const was = call.answered;
             snd("ringStop");
             snd("hangup");
             callClear();
             call.el.classList.remove("ring", "pad");
             callStat(was ? "สิ้นสุดการโทร" : "ยกเลิกการโทร");
             callLater(callFinish, 800);
           };

           function callFinish() {
             callClear();
             snd("ringStop");
             phLog.push({
               name: call.name,
               sub: call.sub,
               when: Date.now(),
               type: call.dir === "in" ? "in" : "out",
             }); /* เก็บในหน่วยความจำเท่านั้น: โหลดหน้าใหม่ = กลับเป็นรายการ default */
             if (phLog.length > 25) phLog.shift();
             try {
               incAfterCall();
             } catch (e) {} /* ตัดสินใจว่าเขาจะโทรกลับไหม */
             const el = call.el;
             if (el) el.classList.remove("on");
             setTimeout(() => {
               if (el) el.innerHTML = "";
               call.on = false;
               call.ending = false;
             }, 420);
             if (document.querySelector(".ph-seg"))
               renderPhone(); /* อัปเดตรายการล่าสุดทันที */
           }

           /* =============== CALL: สายเรียกเข้า ===============
        มีสายเข้า 3 แบบ (กดรับ / ปฏิเสธ / ปล่อยให้ดังจนไม่ได้รับ — สายที่ไม่ได้รับจะขึ้นในแอป Phone และมีป้ายแดงที่ไอคอน):
        1) สุ่มโทรเข้า (rand): หลังปลดล็อกสักพัก จะมีคนในรายชื่อโทรมาเป็นช่วง ๆ สุ่มคนตามน้ำหนักและช่วงเวลาใน CALL_IN.who
        2) โทรกลับ: เราโทรหาแล้วไม่ติด/ไม่รับ → เขาอาจโทรกลับ (back) / ถ้าเราโทรถี่เกินไปก็โทรมาถามว่ามีอะไรหรือเปล่า (worry)
           ถ้าเราไม่รับสายของเขา เขาอาจโทรซ้ำอีกครั้งแล้วถามว่าทำไมไม่รับ (again)
        3) ริคุโทรมาบอกคิดถึง (read): ตอนเรากำลังเปิดอ่านแชทเก่า ("ริคุ (2023)") หรือเลื่อนย้อนอ่านข้อความเก่าอยู่นาน ๆ
        บทสนทนาแก้/เพิ่มได้ที่ IN_DATA ด้านล่าง (ข้อความไทยต้องมีคำแปลใน i18n-call-incoming.js)
        ปรับความถี่ได้ที่ CALL_IN (เวลาเป็นวินาที) — ปิดทั้งหมดด้วย CALL_IN.enabled = false
        ทดสอบเร็ว ๆ ในคอนโซล: callInTest('เจ้าหญิง','read')  /  callInTest('แม่','rand') */
           const CALL_IN = {

           /* ให้ name โทรเข้าเครื่องเรา (kind = rand | back | worry | again | read) */
           function incRing(name, kind) {
             if (
               !CALL_IN.enabled ||
               inc.on ||
               call.on ||
               !IN_DATA[name] ||
               !IN_DATA[name][kind]
             )
               return false;
             Object.assign(inc, { on: true, name, kind, sub: "มือถือ" });
             incMount(incLocked());
             snd("ringtone");
             try {
               if (navigator.vibrate) navigator.vibrate([500, 250, 500, 250, 500]);
             } catch (e) {}
             inc.timer = setTimeout(
               () => incMiss("timeout"),
               CALL_IN.ringMax * 1000,
             );
             return true;
           }

             if (ev) ev.stopPropagation();

             delete incAgainAt[d.name];
             callStart(d.name, d.sub, { incoming: true, kind: d.kind });

           const COAX = {

                   ["them", "ผมนึกว่าพี่ไม่อยากคุยกับผมแล้วจริง ๆ นะ"],
                   ["me", "ไม่มีวัน พี่อยากคุยกับเจ้าหญิงทุกวัน"],
                   ["them", "…พี่ชอบพูดอะไรแบบนี้ ผมถึงงอนไม่ลงสักที"],

           const coaxLast = {};
           function coaxScript(lv) {
             const pool = COAX[lv];
             let i;
             do {
               i = Math.floor(Math.random() * pool.length);
             } while (pool.length > 1 && i === coaxLast[lv]);
             coaxLast[lv] = i;
             const d = pool[i],
               sc = [[0.8, "nar", "(รับสายแล้ว)"]];
             d.lines.forEach((l, n) =>
               sc.push([
                 n === 0
                   ? 1.2
                   : Math.min(4.8, 1.8 + d.lines[n - 1][1].length * 0.04),
                 l[0],
                 l[1],
               ]),
             );
             sc.bye = d.bye;
             return sc;
           }

           const RK_MISS_MSGS = {
             mc1: [
               ["พี่ครับ เมื่อกี้ผมโทรไป พี่ไม่ว่างเหรอ"],
               [
                 "เห็นสายที่ไม่ได้รับของผมไหมครับ",
                 "ไม่มีอะไรหรอก แค่อยากได้ยินเสียงพี่",
               ],
             ],
             mc2: [
               ["พี่ชิอน… ผมโทรไปอีกแล้วนะ", "พี่ไม่รับสายผมอีกแล้วเหรอ"],
               ["เมื่อกี้ก็ไม่รับ ตอนนี้ก็ไม่รับ", "ผมเริ่มคิดมากแล้วนะ"],
             ],
             mc3: [
               [
                 "พี่ไม่รับสายผมหลายครั้งแล้วนะ",
                 "ผมงอนแล้วจริง ๆ นะครับ",
                 "หรือพี่ไม่อยากคุยกับผมแล้ว…",
               ],
               [
                 "พี่ชิอน ผมงอนแล้วนะ",
                 "ไม่รับสายผมหลายรอบแล้ว",
                 "ต้องง้อผมดี ๆ เลยนะ",
               ],
             ],
           };
           function incMissDm() {
             if (!CALL_IN.missDm || !window.__igRikuReply) return;
             const now = Date.now();
             while (rkMiss.length && now - rkMiss[0] > CALL_IN.missMemory * 1000)
               rkMiss.shift();
             rkMiss.push(now);
             const lv = Math.min(3, rkMiss.length);
             if (
               Math.random() >=
               (CALL_IN.missDmChance[lv - 1] == null
                 ? 1
                 : CALL_IN.missDmChance[lv - 1])
             )
               return;
             setTimeout(
               () => {
                 const node = "mc" + lv,
                   sets = RK_MISS_MSGS[node],
                   msgs = sets[Math.floor(Math.random() * sets.length)];
                 msgs.forEach((t, i) =>
                   window.__igRikuReply(t, i === msgs.length - 1 ? node : null),
                 );
               },
               incRnd(CALL_IN.missDmDelay) * 1000,
             );
           }

           function incMiss() {
             if (!inc.on) return;
             const d = { name: inc.name, sub: inc.sub, kind: inc.kind };
             incClear();
             try {
               window.lockNotifAdd &&
                 window.lockNotifAdd({
                   app: "phone",
                   name: d.name,
                   text: "สายที่ไม่ได้รับ",
                   av: IN_AV[d.name],
                 });
             } catch (e) {}
             phLog.push({
               name: d.name,
               sub: d.sub,
               when: Date.now(),
               type: "miss",
             });
             if (phLog.length > 25) phLog.shift();
             if (document.querySelector(".ph-seg"))
               renderPhone(); /* กำลังดูหน้า Recents อยู่ → ขึ้นรายการทันที */
             else {
               appBadges.phone =
                 (appBadges.phone || 0) +
                 1; /* ป้ายแดงที่ไอคอน Phone จนกว่าจะเปิดแอป */
               try {
                 renderHomeAndDock();
               } catch (e) {}
               document
                 .querySelectorAll("#dock .badge")
                 .forEach((b) => b.classList.add("badge-pop"));
             }
             if (d.name === RIKU) incMissDm();
             /* เขาโทรมาแล้วเราไม่รับ → อาจโทรซ้ำอีกครั้งแล้วถามว่าทำไมไม่รับ */
             const last = incAgainAt[d.name] || 0;
             if (
               d.kind !== "again" &&
               Date.now() - last > CALL_IN.againGap * 1000 &&
               Math.random() < CALL_IN.againChance
             ) {
               incAgainAt[d.name] = Date.now();
               incSchedule(d.name, "again", incRnd(CALL_IN.againDelay));
             }
           }

           /* นัดให้ name โทรเข้าในอีก sec วินาที (ถ้าตอนนั้นเรากำลังคุยสายอื่น/พิมพ์แชทอยู่ จะรอสักพัก ไม่งั้นข้าม) */
           function incSchedule(name, kind, sec) {
             if (!CALL_IN.enabled || !incWhoOk(name) || !IN_DATA[name][kind])
               return;
             if (incPend[name]) {
               if (kind !== "worry") return;
               clearTimeout(incPend[name]);
               incPend[name] = null;
             }
             let tries = 0;
             const go = () => {
               incPend[name] = null;
               if (call.on || inc.on || incTyping()) {
                 if (++tries < 14) incPend[name] = setTimeout(go, 5000);
                 return;
               }
               if (incWhoOk(name)) incRing(name, kind);
             };
             incPend[name] = setTimeout(go, sec * 1000);
           }

           /* เรียกตอนวางสายจบ (ใน callFinish): ตัดสินใจว่าเขาจะโทรกลับไหม */
           function incAfterCall() {
             if (!CALL_IN.enabled) return;
             const name = call.name,
               now = Date.now();
             if (name === RIKU && call.answered)
               rkMiss.length = 0; /* ได้คุยกันแล้ว → หายงอน ระดับกลับเป็น 1 */
             if (call.dir === "in") {
               incNextAt = Math.max(incNextAt, now + incRnd(CALL_IN.gap) * 1000);
               return;
             }
             if (String(name).charAt(0) === "+" || !IN_DATA[name]) return;
             if (call.answered) {
               clearTimeout(incPend[name]);
               incPend[name] = null;
               return;
             } /* คุยกันแล้ว ไม่ต้องโทรกลับ */
             const ringSec = (now - call.tDial) / 1000;
             if (!call.failed && ringSec < 4)
               return; /* วางก่อนสายดังนานพอ → เขาไม่เห็นสายที่ไม่ได้รับ */
             const n = (CALL_HIST[name] || []).filter(
               (r) => now - r.t <= CALL_CTX.freqWin,
             ).length;
             if (n >= CALL_IN.worryFrom) {
               const ch =
                 n >= CALL_IN.worryHeavyFrom
                   ? CALL_IN.worryHeavyChance
                   : CALL_IN.worryChance;
               if (Math.random() < ch)
                 return incSchedule(name, "worry", incRnd(CALL_IN.worryDelay));
             }
             if (
               Math.random() <
               (call.failed ? CALL_IN.backChance : CALL_IN.backCancelChance)
             )
               incSchedule(name, "back", incRnd(CALL_IN.backDelay));
           }

           function incPickWho() {
             const h = callHour();
             /* ริคุข้ามกฎ "ห้ามซ้ำคนเดิมติดกัน" และ "บทต้องไม่เคยใช้" (บทหมดแล้ววนใช้ใหม่ ไม่ซ้ำบทก่อนหน้า) */
             const pool = Object.keys(CALL_IN.who).filter(
               (n) =>
                 (n !== incLastWho || n === RIKU) &&
                 IN_DATA[n] &&
                 IN_DATA[n].rand &&
                 incRandOk(n) &&
                 (n === RIKU || incFresh(n, "rand")) &&
                 callInHrs({ hrs: CALL_IN.who[n][1] }, h),
             );
             if (pool.indexOf(RIKU) >= 0) {
               if (!incSeq.length) {
                 if (Math.random() < CALL_IN.firstRikuChance) return RIKU;
                 pool.splice(pool.indexOf(RIKU), 1);
               } /* สายแรก: ริคุเกือบแน่นอน */ else if (
                 CALL_IN.rikuGuarantee &&
                 incSeq[incSeq.length - 1] !== RIKU
               )
                 return RIKU; /* สายก่อนไม่ใช่ริคุ → สายนี้ริคุแน่ */
             }
             const tot = pool.reduce((a, n) => a + CALL_IN.who[n][0], 0);
             if (!tot) return null;
             let r = Math.random() * tot;
             for (let i = 0; i < pool.length; i++) {
               r -= CALL_IN.who[pool[i]][0];
               if (r <= 0) return pool[i];
             }
             return pool[0];
           }

           /* กำลังอ่านข้อความเก่าอยู่ไหม: เปิดแชท "ริคุ (2023)" หรือเลื่อนย้อนขึ้นไปไกลจากข้อความล่าสุด */
           function incReading() {
             if (incLocked() || call.on || inc.on) return false;
             if (!document.querySelector("#chat-detail-screen.active"))
               rd.key = null;
             else if (rd.key === "riku_old") return true;
             const a = document.querySelector(
               "#chat-detail-screen.active #cd-area, #app-screen.active #kk-area",
             );
             return !!a && a.scrollHeight - a.scrollTop - a.clientHeight > 450;
           }
           const _openChatIn = window.openChatDetail;
           if (typeof _openChatIn === "function")
             window.openChatDetail = function (k) {
               rd.key = k;
               return _openChatIn.apply(this, arguments);
             };

           function incTick() {
             if (!CALL_IN.enabled || document.hidden) return;
             const now = Date.now();
             if (!incUnlocked) {
               if (incLocked()) return;
               incUnlocked = true;
               incNextAt = now + CALL_IN.firstDelay * 1000;
               return;
             }
             /* ริคุโทรมาบอกคิดถึงตอนเรากำลังอ่านข้อความเก่า */
             const reading = incReading();
             if (reading) {
               rd.quiet = 0;
               rd.sec += 5;
               if (!rd.target) rd.target = incRnd(CALL_IN.readDwell);
             } else if ((rd.quiet += 5) >= 10) {
               rd.sec = 0;
               rd.target = 0;
               rd.done = false;
             }
             if (reading && !rd.done && rd.sec >= rd.target && !incTyping()) {
               rd.done = true;
               if (
                 now > rd.cool &&
                 incRandOk("เจ้าหญิง") &&
                 Math.random() < CALL_IN.readChance &&
                 incWhoOk("เจ้าหญิง") &&
                 incRing("เจ้าหญิง", "read")
               ) {
                 incRandMark("เจ้าหญิง");
                 rd.cool = now + CALL_IN.readCooldown * 1000;
                 incNextAt = Math.max(incNextAt, now + 120000);
                 return;
               }
             }
             /* สุ่มโทรเข้า */
             if (inc.on || call.on || incTyping() || now < incNextAt) return;
             const who = incPickWho();
             incNextAt = now + (who ? incRnd(CALL_IN.gap) : 60) * 1000;
             if (who && incRing(who, "rand")) {
               incLastWho = who;
               incRandMark(who);
             }
           }
           setInterval(incTick, 5000);
           window.CALL_IN = CALL_IN;
           /* ทดสอบสัดส่วน: incSim(n) สุ่ม n สาย (ไม่เรียกสายจริง) แล้วคืนสถิติ */
           window.incMissTest = function () {
             incMissDm();
             return rkMiss.length;
           };
           window.incSim = function (n) {
             const seq = [],
               bak = incSeq.length;
             let last = "";
             for (let i = 0; i < n; i++) {
               Object.keys(incCnt).forEach((k) => delete incCnt[k]);
               Object.keys(incLastAt).forEach((k) => delete incLastAt[k]);
               const w = incPickWho();
               if (!w) continue;
               seq.push(w);
               incSeq.push(w);
               incLastWho = w;
             }
             incSeq.length = bak;
             incLastWho = "";
             const c = {};
             seq.forEach((w) => (c[w] = (c[w] || 0) + 1));
             let bad = 0;
             for (let i = 1; i < seq.length; i++)
               if (seq[i] !== RIKU && seq[i - 1] !== RIKU) bad++;
             return {
               n: seq.length,
               counts: c,
               rikuPct: Math.round((100 * (c[RIKU] || 0)) / seq.length),
               nonRikuPairs: bad,
               first: seq[0],
             };
           };
           window.callInTest = function (name, kind) {
             return incRing(name || "เจ้าหญิง", kind || "rand");
           };

           /* =============== ROUTER =============== */
           const _openApp = window.openApp;
           const modern = {
             messages: renderMessages,
             notes: renderNotes,
             photos: renderPhotos,
             calendar: renderCalendar,
             safari: renderSafari,
             kakaotalk: renderKakaoHome,
             phone: renderPhone,
           };
           window.openApp = function (id, title) {
             if (id === "instagram") {
               window.openIgHome();
               return;
             }
             if (modern[id]) {
               $("#app-header").style.display = "none";
               $("#app-screen").classList.remove("dark");
               modern[id]();
               showScreen("app-screen");
               return;
             }
             _openApp(id, title);
           };
         })();
    </script>
